services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: english_learning
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres_data:
