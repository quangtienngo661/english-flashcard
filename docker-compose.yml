services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: english_learning
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

  redis:
    image: redis:7.4-alpine
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    ports:
      # 6379 may be taken by other local projects, like 5432/5433 were for Postgres.
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
