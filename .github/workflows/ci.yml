name: CI

# Runs on pull requests only (into main, dev or documents). A merge does not re-run it: the PR run already tested the change,
# and deploy-web.yml (workflow Deploy) only deploys on push to main. Keep this workflow a required check on main and dev.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (lint, typecheck, build, unit, schema drift)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    services:
      # Live database for the migrations and the schema drift check.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: english_learning
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U dev -d english_learning"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dev:dev@localhost:5434/english_learning
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate and generate the Prisma client
        run: pnpm db:setup

      # The database was just migrated from prisma/migrations, so an empty diff to prisma/models means no model change lacks a
      # migration. --exit-code: 0 empty, 2 not empty, 1 error (Bước 4 D40; replaces test/common/schema-drift.e2e-spec.ts).
      - name: Schema drift check (committed migrations vs Prisma schema)
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma --exit-code --script

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  admin:
    name: admin (lint, typecheck, unit, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint + raw Tailwind value check)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build (production host guard)
        run: pnpm build
        env:
          VITE_API_BASE_URL: https://admin-api.wordmet.com
          # Cloudflare's test site key (always passes): the production build refuses to run without one.
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build for e2e
        run: pnpm build:e2e
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: E2E tests (Playwright + axe, mocked API)
        run: pnpm test:e2e
        env:
          VITE_API_BASE_URL: http://localhost:3000
