name: CI

# Runs on pull requests only (into main, dev or documents). A merge does not re-run it: the PR run already tested the change,
# and deploy-web.yml only builds and deploys on push to main. Keep this workflow a required check on main and dev.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (lint, typecheck, build, unit, schema drift)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    services:
      # Live database for `prisma generate --sql` (TypedSQL needs a migrated DB to infer types) and for the schema drift check.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: english_learning
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U dev -d english_learning"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dev:dev@localhost:5434/english_learning
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate and generate Prisma client + TypedSQL
        run: pnpm db:setup

      # The database was just migrated from prisma/migrations, so an empty diff to prisma/models means no model change lacks a
      # migration. --exit-code: 0 empty, 2 not empty, 1 error (Bước 4 D40; replaces test/common/schema-drift.e2e-spec.ts).
      - name: Schema drift check (committed migrations vs Prisma schema)
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma --exit-code --script

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  web:
    name: web (lint, typecheck, unit, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint + raw Tailwind value check)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (Playwright + axe)
        run: pnpm test:e2e

      - name: Static pages
        run: pnpm assert:static
        env:
          # The e2e build above runs with the learner app on (playwright.config.ts), so /vi/app and /en/app must be static too.
          NEXT_PUBLIC_LEARNER_APP: 'on'

  admin:
    name: admin (lint, typecheck, unit, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint + raw Tailwind value check)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build (production host guard)
        run: pnpm build
        env:
          VITE_API_BASE_URL: https://admin-api.wordmet.com

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build for e2e
        run: pnpm build:e2e
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: E2E tests (Playwright + axe, mocked API)
        run: pnpm test:e2e
        env:
          VITE_API_BASE_URL: http://localhost:3000

  admin-e2e-real:
    name: admin-e2e-real (admin app against the real API, worker, Postgres, Redis, Mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: english_learning
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U dev -d english_learning"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: API environment (secrets are generated for this run only)
        working-directory: apps/api
        run: |
          secret() { node scripts/gen-secret.mjs; }
          {
            echo "DATABASE_URL=postgresql://dev:dev@localhost:5434/english_learning"
            echo "REDIS_URL=redis://localhost:6380"
            echo "JWT_KEYS=k1:$(secret)"
            echo "JWT_ISSUER=ci-issuer"
            echo "JWT_AUDIENCE=ci-audience"
            echo "OTP_HMAC_KEY=$(secret)"
            echo "RATE_LIMIT_HMAC_KEY=$(secret)"
            echo "REFRESH_GRACE_KEY=$(secret)"
            echo "MAIL_BUDGET_KEY=$(node -e 'console.log(crypto.randomUUID())')"
            echo "MAIL_DAILY_BUDGET=1500"
            echo "SMTP_HOST=localhost"
            echo "SMTP_PORT=1025"
            echo "SMTP_FROM=no-reply@localhost"
            echo "SMTP_SECURE=false"
            echo "CORS_ORIGINS=http://localhost:5173"
            echo "ADMIN_APP_URL=http://localhost:5173"
            echo "LEARNER_APP_URL=http://localhost:3001"
            echo "TERMS_VERSION=2026-10-20"
            echo "PROBLEM_TYPE_BASE=http://localhost:3000/problems/"
            echo "TRUST_PROXY=false"
            echo "MAINTENANCE_ENABLED=false"
            echo "JOB_QUEUE_PREFIX=ci-admin-e2e"
            echo "AI_FAKE_ENABLED=true"
            echo "IMPORT_RECONCILE_SECONDS=1"
            echo "IMPORT_LEASE_SECONDS=6"
            echo "IMPORT_HEARTBEAT_SECONDS=2"
          } >> "$GITHUB_ENV"

      - name: API setup, build, and start (API and worker in the background)
        working-directory: apps/api
        run: |
          pnpm db:setup
          pnpm build
          nohup node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          nohup node dist/worker.js > "$RUNNER_TEMP/worker.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/v1/health > /dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Install Playwright Chromium
        working-directory: apps/admin
        run: pnpm exec playwright install --with-deps chromium

      - name: Real-stack e2e (Playwright)
        working-directory: apps/admin
        run: pnpm test:e2e:real

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-real-report
          path: |
            apps/admin/playwright-report
            apps/admin/test-results
          if-no-files-found: ignore

      - name: API and worker logs on failure
        if: failure()
        run: |
          echo "--- api ---"; tail -n 100 "$RUNNER_TEMP/api.log" || true
          echo "--- worker ---"; tail -n 100 "$RUNNER_TEMP/worker.log" || true
