name: Deploy web

# Deploys apps/web to Cloudflare Workers after CI passes on main (or by hand from the Actions tab).
# Needs secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit) and CLOUDFLARE_ACCOUNT_ID in environment deploy-env.
# D1 migrations are NOT applied here: run `pnpm db:migrate:remote` before merging a new migration
# (plan 2026-10-08-landing-deploy, spec §5).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy apps/web to Cloudflare
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are secrets of this GitHub environment.
    environment: deploy-env
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      # Baked into the build (README "Environment"). wordmet.com is attached by `routes` in apps/web/wrangler.jsonc.
      NEXT_PUBLIC_SITE_URL: https://wordmet.com
      NEXT_PUBLIC_INDEXABLE: 'true'
      NEXT_PUBLIC_CONTACT_EMAIL: hello@wordmet.com
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run, deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (OpenNext)
        run: pnpm cf:build

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
