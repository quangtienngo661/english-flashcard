name: Deploy web

# Deploys apps/web to Cloudflare Workers on every push to main (or by hand from the Actions tab).
# CD only builds and deploys; it runs no tests. CI (ci.yml) runs on the pull request before it is merged and does not
# re-run on merge (branching model in CLAUDE.md), so main must only receive PRs whose CI is green.
# Needs secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit) and CLOUDFLARE_ACCOUNT_ID in environment deploy-env.
# D1 migrations are NOT applied here: run `pnpm db:migrate:remote` before merging a new migration
# (plan 2026-10-08-landing-deploy, spec §5).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy apps/web to Cloudflare
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are secrets of this GitHub environment.
    environment: deploy-env
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      # Baked into the build (README "Environment"). wordmet.com is attached by `routes` in apps/web/wrangler.jsonc.
      NEXT_PUBLIC_SITE_URL: https://wordmet.com
      NEXT_PUBLIC_INDEXABLE: 'true'
      NEXT_PUBLIC_CONTACT_EMAIL: hello@wordmet.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (OpenNext)
        run: pnpm cf:build

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
