packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 blocks dependency build scripts unless decided here (CI fails with ERR_PNPM_IGNORED_BUILDS).
allowBuilds:
  '@prisma/engines': true
  prisma: true
  argon2: true
  esbuild: true
  # Optional native helpers pulled in by testcontainers (docker-modem ssh); not needed.
  cpu-features: false
  ssh2: false
  protobufjs: false
