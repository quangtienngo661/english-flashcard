  --pass:#62c98f; --pass-soft:#142a1e; --fail:#ff8d80; --fail-soft:#311a18; --frame:#0b0d14;
  --shadow-card:0 1px 2px rgb(0 0 0 / .4),0 18px 36px -20px rgb(0 0 0 / .85); --shadow-row:0 8px 18px -12px rgb(0 0 0 / .8); --shadow-pop:0 30px 70px -24px rgb(0 0 0 / .9); --shadow-btn:none; --scrim:rgb(0 0 0 / .55); color-scheme:dark}}
:root[data-theme="dark"]{

.tbar{position:relative;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 0 12px}

/* ===== phần dùng chung trong app ===== */

.tb:hover{background:var(--accent-soft)}

.f2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

    $('notes').innerHTML = '<section><h3>' + 'ABCDE'[st.v] + ' · ' + V[st.p][st.v][0] + '</h3><ul>' + vn.map(li).join('') + '</ul></section><section><h3>' + p.t + ': sửa so với Figma</h3><ul>' + PN[st.p].map(li).join('') + '</ul></section><section><h3>Chung cho vòng 15</h3><ul>' + GEN.map(li).join('') + '</ul></section>';
    setHash();
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-p],[data-v],[data-dev],[data-view],[data-s]'); if (!b || b.closest('#screen')) return;
    if (b.dataset.p) { st.p = b.dataset.p; st.v = 0; }
    if (b.dataset.v !== undefined) { st.v = +b.dataset.v; if (b.dataset.open) st.view = 'one'; }
    if (b.dataset.dev) st.dev = b.dataset.dev;
    if (b.dataset.view) st.view = b.dataset.view;
    if (b.dataset.s) st.s = b.dataset.s;
    render();
  });
  document.addEventListener('keydown', function(e){
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('th')) { st.v = +e.target.dataset.v; st.view = 'one'; render(); return; }
    var i = P.indexOf(cur());
    if (e.key === 'ArrowRight') { st.v = (st.v + 1) % 5; }
    else if (e.key === 'ArrowLeft') { st.v = (st.v + 4) % 5; }
    else if (e.key === 'ArrowDown') { st.p = P[(i + 1) % P.length].k; st.v = 0; }
    else if (e.key === 'ArrowUp') { st.p = P[(i + P.length - 1) % P.length].k; st.v = 0; }
    else return;
    e.preventDefault(); render();
  });
  addEventListener('resize', function(){ st.view === 'one' ? fit() : fitThumbs(); });
  readHash(); render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ st.view === 'one' ? fit() : fitThumbs(); });
})();
</script>
