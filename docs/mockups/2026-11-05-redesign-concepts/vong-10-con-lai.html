<title>Các màn còn lại</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: chooser (7 screens × 5 background directions × 2 devices), one scaled device frame, audit + notes. Tokens: landing bản 3 with the navy accent chosen 08/11/2026. */
:root{
  --bg:#f6f7fa; --surface:#ffffff; --ink:#1b2444; --muted:#525a78; --line:#dde1ea; --ghost:#c9cedc;
  --accent:#1e3a8a; --accent-soft:#e7ecf8; --on-accent:#ffffff; --mark:#ffd84a; --mark-ink:#1b2444;
  --pass:#1b7a46; --pass-soft:#e4f2ea; --fail:#b8352a; --fail-soft:#f8e7e5; --frame:#e9ebf1;
  --f-display:'Bricolage Grotesque','Noto Sans',system-ui,sans-serif; --f-body:'Noto Sans',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(0.23,1,0.32,1); --shadow:0 24px 48px -30px rgb(27 36 68 / .5); --shadow-s:0 10px 24px -18px rgb(27 36 68 / .4);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131c; --surface:#1a1f2d; --ink:#eceef5; --muted:#a6adc4; --line:#2e3549; --ghost:#3a4157; --accent:#8da2ff; --accent-soft:#1f2747; --on-accent:#10131c;
  --pass:#62c98f; --pass-soft:#142a1e; --fail:#ff8d80; --fail-soft:#311a18; --frame:#0b0d14; --shadow:0 24px 48px -30px rgb(0 0 0 / .8); --shadow-s:0 10px 24px -18px rgb(0 0 0 / .7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131c; --surface:#1a1f2d; --ink:#eceef5; --muted:#a6adc4; --line:#2e3549; --ghost:#3a4157; --accent:#8da2ff; --accent-soft:#1f2747; --on-accent:#10131c;
  --pass:#62c98f; --pass-soft:#142a1e; --fail:#ff8d80; --fail-soft:#311a18; --frame:#0b0d14; --shadow:0 24px 48px -30px rgb(0 0 0 / .8); --shadow-s:0 10px 24px -18px rgb(0 0 0 / .7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--frame);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
mark{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px}
kbd{font-family:var(--f-mono);font-size:11px;font-weight:700;min-width:20px;height:20px;display:inline-grid;place-items:center;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg);color:var(--ink);line-height:1}
.mono{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:18px}
.intro{display:grid;gap:8px;max-width:76ch}
.intro h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.2}
.intro p{color:var(--muted)}
.vrow{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px}
.choose{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;text-align:left;transition:border-color .2s}
.chip small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.stage{position:relative;overflow:hidden;border-radius:20px;justify-self:center}
.scaler{transform-origin:top left;width:max-content}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.notes section{background:var(--surface);border-radius:16px;padding:16px 18px;display:grid;gap:6px;align-content:start}
.notes h3{font-size:16px;font-weight:700}
.notes ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px;color:var(--muted);line-height:1.5}
.notes b{color:var(--ink);font-weight:600}
@media (max-width:900px){.notes{grid-template-columns:1fr}}

/* ===== device, glass top bar ===== */
.dev{background:var(--bg);color:var(--ink);overflow:hidden;position:relative}
.dev.desk{width:1200px} .dev.phone{width:390px}
.ab{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;gap:28px;padding:0 32px;background:color-mix(in srgb,var(--surface) 62%,transparent);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 10px 22px -14px rgb(30 58 138 / .35)}
.logo{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.03em;display:inline-flex;align-items:baseline;gap:2px}
.logo i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.tabs{display:flex;gap:22px;font-size:15px;font-weight:500;color:var(--muted)}
.tabs span{position:relative;padding:20px 0} .tabs span.on{color:var(--ink);font-weight:600}
.tabs span.on::after{content:"";position:absolute;left:0;right:0;bottom:12px;height:2px;border-radius:2px;background:var(--ink)}
.cmd{margin-left:auto;display:flex;align-items:center;gap:8px;width:300px;height:40px;padding:0 10px 0 12px;border-radius:12px;background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--muted);font-size:14px}
.cmd span{flex:1}
.addw{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 14px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px}
.addw kbd,.btn kbd{background:transparent;color:inherit;border-color:rgb(255 255 255 / .45)}
.ava{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:14px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.phone .ab{height:56px;padding:0 16px;gap:12px} .phone .ab .sp{flex:1}
.tb{position:relative;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 0 10px}
.tb span{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding-top:4px}
.tb span.on{color:var(--ink);font-weight:700} .tb span.on .ic{stroke:var(--accent)}

/* ===== shared parts ===== */
.scr{position:relative;isolation:isolate;min-height:820px;padding:96px 60px 72px;margin-top:-64px;display:grid;gap:20px;align-content:start}
.phone .scr{padding:76px 16px 28px;margin-top:-56px;min-height:780px;gap:16px}
.scr > *{position:relative;z-index:1}
.scr::before,.scr::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none}
.pn{background:var(--surface);border-radius:18px;padding:22px;box-shadow:var(--shadow-s)}
.phone .pn{padding:16px;border-radius:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;white-space:nowrap;transition:transform .15s var(--ease),filter .2s}
.btn:hover{filter:brightness(1.12)} .btn:active{transform:scale(.97)}
.btn.ok{background:var(--pass)}
.lnk{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent);text-underline-offset:4px}
.lnk.mut{color:var(--muted);text-decoration-color:color-mix(in srgb,var(--muted) 35%,transparent)}
.lnk.bad{color:var(--fail);text-decoration-color:color-mix(in srgb,var(--fail) 35%,transparent)}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px;color:var(--accent)}
.back .ic{width:16px;height:16px}
.h1{font-family:var(--f-display);font-size:42px;font-weight:800;letter-spacing:-.035em;line-height:1.08}
.phone .h1{font-size:30px}
.sub{color:var(--muted);max-width:60ch}
.chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ghost);background:var(--surface);display:inline-grid;place-items:center;flex:none}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk .ic{width:12px;height:12px;stroke-width:3.4}
.chk.dis{opacity:.4}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:2px 0}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.ticks{display:flex;gap:3px}
.ticks i{width:14px;height:6px;border-radius:2px;background:var(--line)}
.ticks i.ok{background:var(--pass)} .ticks i.no{background:var(--fail)} .ticks i.now{background:var(--ink)}
.row2{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.sp{flex:1}
.big{font-family:var(--f-display);font-weight:800;letter-spacing:-.05em;line-height:.85;font-variant-numeric:tabular-nums}

/* ===== 5 hướng nền và bề mặt ===== */
/* D2 Lưới chấm + quầng: chấm 20 px mờ dần ra mép, quầng navy góc trái trên và vàng góc phải dưới; khối chỉ có viền */
.d2 .scr::before{background-image:radial-gradient(color-mix(in srgb,var(--ink) 11%,transparent) 1.1px,transparent 1.4px);background-size:20px 20px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 35%,#000 35%,transparent 90%);mask-image:radial-gradient(ellipse 80% 70% at 50% 35%,#000 35%,transparent 90%)}
.d2 .scr::after{background:radial-gradient(50% 45% at 8% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),radial-gradient(40% 40% at 100% 100%,color-mix(in srgb,var(--mark) 26%,transparent),transparent 70%)}
.d2 .pn{border:1px solid var(--line);box-shadow:var(--shadow-card)}

/* ===== Bóng khối, nút lịch nổi và modal Lịch học (vòng 9) ===== */
:root{--shadow-card:0 1px 2px rgb(30 58 138 / .06),0 16px 34px -20px rgb(30 58 138 / .34);--shadow-pop:0 2px 6px rgb(30 58 138 / .10),0 30px 70px -26px rgb(30 58 138 / .50);--scrim:rgb(27 36 68 / .30);--c-learn:#1e3a8a;--c-rev:#1b7a46;--c-prac:#d99a17}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow-card:0 1px 2px rgb(0 0 0 / .4),0 18px 36px -20px rgb(0 0 0 / .85);--shadow-pop:0 30px 70px -24px rgb(0 0 0 / .9);--scrim:rgb(0 0 0 / .55);--c-learn:#8da2ff;--c-rev:#62c98f;--c-prac:#f0c04a}}
:root[data-theme="dark"]{--shadow-card:0 1px 2px rgb(0 0 0 / .4),0 18px 36px -20px rgb(0 0 0 / .85);--shadow-pop:0 30px 70px -24px rgb(0 0 0 / .9);--scrim:rgb(0 0 0 / .55);--c-learn:#8da2ff;--c-rev:#62c98f;--c-prac:#f0c04a}
.notes code{font-family:var(--f-mono);font-size:12.5px;color:var(--ink)}

/* nút lịch nổi: tờ lịch nhỏ ghi ngày hôm nay, góc có số ngày liên tiếp */
.fab{position:absolute;right:28px;bottom:28px;z-index:40;width:62px;height:66px;border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-pop);display:grid;grid-template-rows:20px 1fr;transition:transform .18s var(--ease),opacity .2s}
.fab:hover{transform:translateY(-2px)} .fab:active{transform:scale(.95)}
.fab .fh{background:var(--accent);color:var(--on-accent);border-radius:16px 16px 0 0;font-family:var(--f-mono);font-size:10px;font-weight:700;display:flex;align-items:center;padding-left:9px;letter-spacing:.06em}
.fab .fd{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;display:grid;place-items:center}
.fab .fs{position:absolute;top:-9px;right:-11px;display:inline-flex;align-items:center;gap:2px;height:22px;padding:0 7px 0 5px;border-radius:11px;background:var(--mark);color:var(--mark-ink);font-family:var(--f-display);font-weight:800;font-size:12px;box-shadow:0 0 0 2px var(--bg)}
.fab .fs .ic{width:13px;height:13px;stroke-width:2.2}
.fab .tip{position:absolute;right:calc(100% + 12px);top:50%;transform:translate(6px,-50%);opacity:0;white-space:nowrap;background:var(--ink);color:var(--surface);font-size:13px;font-weight:600;padding:6px 8px 6px 10px;border-radius:9px;pointer-events:none;transition:opacity .15s,transform .15s var(--ease);display:inline-flex;align-items:center;gap:8px}
.fab:hover .tip,.fab:focus-visible .tip{opacity:1;transform:translate(0,-50%)}
.fab .tip kbd{background:transparent;color:inherit;border-color:rgb(255 255 255 / .4)}
.phone .fab{right:16px;bottom:84px;width:54px;height:58px;grid-template-rows:18px 1fr}
.phone .fab.notab{bottom:20px}
.phone .fab .fd{font-size:22px}
.calopen .fab{opacity:0;pointer-events:none}
/* chừa chỗ cuối trang để nút nổi không che nội dung cuối */
.dev .scr{padding-bottom:124px} .dev.phone .scr{padding-bottom:100px}
/* điện thoại trong phiên (không có thanh tab): nút lịch vào thanh trên, không nổi, để không che nút trả lời */
.calmini{width:32px;height:34px;border:0;padding:0;border-radius:9px;background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),var(--shadow-card);display:grid;grid-template-rows:11px 1fr;overflow:hidden}
.calmini .fh{background:var(--accent);color:var(--on-accent);font-family:var(--f-mono);font-size:7.5px;font-weight:700;display:grid;place-items:center}
.calmini .fd{font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1;display:grid;place-items:center}

/* modal */
.dev.calopen.desk{height:940px} .dev.calopen.phone{height:844px}
.scrim{position:absolute;inset:0;z-index:60;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:calFade .2s var(--ease) both}
.cal{position:absolute;z-index:61;left:50%;top:80px;width:720px;max-width:calc(100% - 48px);transform:translateX(-50%);max-height:830px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow-pop);display:grid;grid-template-columns:minmax(0,1fr);overflow:auto;animation:calPop .24s var(--ease) both}
.cal.dayv{width:640px}
.cal.slide{animation:calSlide .22s var(--ease) both} .cal.slide.back{animation-name:calSlideB}
.cal.noanim,.scrim.noanim{animation:none}
@keyframes calFade{from{opacity:0}}
@keyframes calPop{from{opacity:0;transform:translate(-50%,12px) scale(.97)}}
@keyframes calSheet{from{opacity:.4;transform:translateY(60px)}}
@keyframes ddIn{from{opacity:0;transform:translateY(4px)}}
@keyframes calSlide{from{opacity:0;transform:translate(calc(-50% + 22px),0)}}
@keyframes calSlideB{from{opacity:0;transform:translate(calc(-50% - 22px),0)}}
.cx{position:absolute;top:16px;right:16px;z-index:2;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.cx .ic{width:18px;height:18px}
.cxin{margin-left:8px;color:var(--muted)}
.ch .nav.cxin .ic,.dh9 .nav.cxin .ic{width:18px;height:18px}
.cl{padding:26px 28px 22px;display:grid;gap:16px;align-content:start;overflow:auto}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ch h2{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.ch .nav{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ch .nav .ic{width:16px;height:16px}
.ch .nav:disabled{opacity:.35;cursor:default}
.strk{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 8px;border-radius:14px;background:var(--mark);color:var(--mark-ink);font-weight:700;font-size:13px}
.strk .ic{width:15px;height:15px;stroke-width:2.2}
.msum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden}
.msum div{padding:10px 14px;display:grid;gap:0}
.msum div + div{border-left:1px solid var(--line)}
.msum b{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.msum span{font-size:12.5px;color:var(--muted)}
.msum .l b{color:var(--c-learn)} .msum .r b{color:var(--c-rev)} .msum .p b{color:color-mix(in srgb,var(--c-prac),var(--ink) 30%)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:0 3px}
.wk span{padding-left:10px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px}
.dc{position:relative;height:74px;border:0;padding:0;background:none;text-align:left;color:var(--ink)}
.dc::before{content:"";position:absolute;inset:7px 0;background:transparent}
.dc.on::before{background:var(--accent-soft)}
.dc.on:not(.jl)::before{left:3px;border-top-left-radius:14px;border-bottom-left-radius:14px}
.dc.on:not(.jr)::before{right:3px;border-top-right-radius:14px;border-bottom-right-radius:14px}
.dc .in{position:absolute;inset:3px;z-index:1;border-radius:12px;padding:9px 10px 10px;display:flex;flex-direction:column;justify-content:space-between;transition:background .15s,box-shadow .15s}
.dc:hover .in{background:color-mix(in srgb,var(--surface) 75%,transparent)}
.dc .n{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1;display:flex;align-items:baseline;gap:5px}
.dc.today .n{color:var(--accent)}
.dc.today .n::after{content:"hôm nay";font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:0}
.dc .dt{display:flex;gap:4px;min-height:7px}
.dc .dt i{width:7px;height:7px;border-radius:50%}
.dc .dt i.l{background:var(--c-learn)} .dc .dt i.r{background:var(--c-rev)} .dc .dt i.p{background:var(--c-prac)}
.dc.out .n{color:var(--ghost)} .dc.out.on::before{opacity:.55} .dc.out .dt{opacity:.55}
.dc.fut .n{color:var(--ghost)} .dc.fut{cursor:default}
.dc.sel .in{background:var(--surface);box-shadow:0 0 0 2px var(--accent),var(--shadow-card)}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);align-items:center}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:8px;height:8px;border-radius:50%} .lgd i.l{background:var(--c-learn)} .lgd i.r{background:var(--c-rev)} .lgd i.p{background:var(--c-prac)}
.lgd i.b{width:22px;height:10px;border-radius:5px;background:var(--accent-soft)}
.cf{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--muted)}
.cf .keys9{display:inline-flex;gap:6px;align-items:center}
.dh9{display:flex;align-items:center;gap:8px;padding:18px 22px 0 22px}
.back9{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:6px 8px 6px 2px;font-weight:600;font-size:14px;color:var(--accent)}
.back9 .ic{width:16px;height:16px}
.dh9 .nav{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.dh9 .nav .ic{width:16px;height:16px} .dh9 .nav:disabled{opacity:.35;cursor:default}
.cal .dd{padding:8px 28px 28px}
.dd{padding:26px 26px 28px;display:grid;gap:14px;align-content:start;animation:ddIn .18s var(--ease) both}

    caidat: ['Mỗi khối có icon trong ô vuông màu ở đầu: bỏ, tiêu đề chữ đủ rõ.', 'Nút "Sửa" trắng nổi: nay là liên kết.', 'Chip "✓ Mật khẩu", "✓ Google" màu xanh: nay là dấu ✓ kèm chữ.', 'Đồng hồ lượt dùng: giữ, số ghi cạnh thanh.'],
    taikhoan: ['Dải nền màu "Pro · Gói Pro" có nhãn viên: nay là một dòng chữ kèm liên kết "Xem gói".', 'Chip "Đã xác minh" xanh: nay là ✓ kèm chữ.'],
    xoatk: ['Hai thẻ bằng nhau, mỗi dòng một icon tròn: nay là một khối hai cột; × đỏ cho thứ bị xóa, chấm cho thứ còn giữ.', 'Dải cảnh báo nền đỏ: nay là một câu chữ đỏ có icon.'],
    giaodich: ['Cột Loại có icon trong ô vuông: nay chỉ là chữ.', 'Trạng thái là viên màu: nay là chấm màu kèm chữ.', 'Hai thẻ "Gói học", "Về giao dịch" có icon: nay là hai cột chữ, không khung.'],
    gdchitiet: ['Chip "Thành công": nay là chấm kèm chữ.', 'Ô nền xám có icon "Có câu hỏi…": nay là một câu chữ nhạt.', 'Nút "Đóng" trắng nổi: nay là nút viền.'],
    goihoc: ['Giữ bố cục giá như landing (Pro có viền và quầng), vì bạn đã chốt ở bản 3.', 'Ô "AI đi cùng bạn" nền gradient, mỗi dòng một icon ô vuông: nay gộp vào danh sách dấu ✓.', 'Ba ô kỳ dạng thẻ có nhãn viên "−16%", "Tiết kiệm nhất": nay là ba dòng chọn, nhãn là chữ nhỏ.', 'Nút xám "Bạn đang dùng gói này": nay là dòng chữ nhạt, không trông như nút bị khóa.'],
    donhang: ['Vòng tròn xanh có dấu ✓ lớn ở giữa: nay là dấu ✓ cạnh tiêu đề, căn trái.', 'Ô xám chứa các dòng thông tin: nay là danh sách kẻ mảnh.', 'Nút viền "Xem gói": nay là liên kết.'],
    dhkhac: ['Bốn thẻ bằng nhau, mỗi thẻ một icon trong vòng tròn màu: nay chỉ còn chấm trạng thái (nhấp nháy khi đang chờ, đỏ khi đã dừng), tiêu đề và câu.'],
    ovthemtu: ['Danh sách nghĩa nằm trong khối màu, nghĩa được chọn là thẻ trắng nổi (khung trong khung): nay là danh sách kẻ mảnh, dòng chọn tô nhạt.', 'Nút trắng nổi "Nghĩa khác, tự nhập": gộp vào liên kết "Không phải nghĩa bạn cần?".'],
    ovthemcau: ['Xem trước là thẻ trắng trong khối xám: nay là một thẻ nhỏ giống mặt sau thẻ ôn.'],
    ovloat: ['Ba chip lọc dạng viên: nay là một dòng chữ.', 'Ô xám có chip "Mới": nay là một câu.'],
    ovai: ['Khối AI nền gradient vàng-xanh, viền sáng, nhãn viên "AI gợi ý": nay là khối thường có nhãn vuông "AI gợi ý"; vẫn tách rõ khỏi nghĩa có sẵn.', 'Nút "Chọn" trắng nổi: nay là nút viền nhỏ.'],
    ovnhom: ['Giữ bố cục; thêm chấm màu nhóm trước tên, khớp màu bìa nhóm ở trang Nhóm.', 'Ô tìm nền xám: nay là ô nhập thường.'],
    ovpro: ['Giữ viền và quầng như gói Pro; nhãn viên "Pro", "Có AI": nay là nhãn vuông.', 'Đề xuất thêm liên kết "Để sau" cạnh nút (bản cũ chỉ có nút ✕).']
  };
  function notes(x){ return '<section><h3>' + x.t + ': AI slop đã sửa</h3><ul>' + (AUD[x.k] || []).map(li).join('') + '</ul></section><section><h3>Chung cho vòng 10</h3><ul><li>Nền lưới chấm, khối viền 1 px và bóng navy, nút lịch nổi như vòng 9.</li><li>Câu chữ lấy đúng từ khung Figma hiện có (tức chữ của app); chỗ nào thêm chữ mới thì ghi là đề xuất.</li><li>Bố cục chung: nút chính một màu đậm, việc phụ là liên kết; trạng thái là chấm màu kèm chữ; bỏ icon trong ô vuông và nút trắng nổi.</li></ul></section>'; }

  var screen = $('screen'), scaler = $('scaler'), stage = $('stage');
  function chrome(inner, tab){
    var tabs = [['Hôm nay','today'],['Nhóm','group'],['Luyện tập','prac'],['Tra từ','look']];
    if (ph()) return '<header class="ab"><span class="logo">wordmet<i></i></span><span class="sp"></span>' + ic('look') + (tab != null ? '' : '<button type="button" class="calmini" data-fab aria-label="Mở lịch học, phím L"><span class="fh">T' + (toD(TODAY).getMonth()+1) + '</span><span class="fd">' + toD(TODAY).getDate() + '</span></button>') + '<span class="ava">L</span></header>' + inner + (tab != null ? '<nav class="tb">' + tabs.map(function(t){ return '<span class="' + (t[0]===tab?'on':'') + '">' + ic(t[1]) + t[0] + '</span>'; }).join('') + '</nav>' : '');
    return '<header class="ab"><span class="logo">wordmet<i></i></span><nav class="tabs">' + tabs.map(function(t){ return '<span class="' + (t[0]===tab?'on':'') + '">' + t[0] + '</span>'; }).join('') + '</nav><div class="cmd">' + ic('look') + '<span>Tìm từ hoặc gõ lệnh</span><kbd>/</kbd></div><button type="button" class="addw">' + ic('plus') + 'Thêm từ <kbd>N</kbd></button><span class="ava">L</span></header>' + inner;
  }
  function cur(){ return S.filter(function(x){ return x.k === st.s; })[0]; }
  function render(){
    var s = cur();
    screen.className = 'dev ' + st.dev + ' d' + st.d + (st.open ? ' calopen' : '') + (s.ov ? ' ovopen' : '');
    screen.innerHTML = chrome('<div class="scr x-' + (s.base || s.k) + ' d' + st.d + '">' + R[st.s]() + '</div>', s.tab) + fab(s) + (s.ov ? s.ov() : '') + (st.open ? cal() : '');
    document.querySelectorAll('[data-s]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.s === st.s)); });
    document.querySelectorAll('[data-d]').forEach(function(b){ b.setAttribute('aria-pressed', String(Number(b.dataset.d) === st.d)); });
    document.querySelectorAll('[data-dev]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.dev === st.dev)); });
    document.querySelectorAll('[data-cal]').forEach(function(b){ if (!screen.contains(b)) b.setAttribute('aria-pressed', String(st.open)); });
    $('notes').innerHTML = notes(s);
    fit();
  }
  function fit(){ var Wd = ph() ? 390 : 1200, s = Math.min(1, stage.parentElement.clientWidth / Wd); scaler.style.transform = 'scale(' + s + ')'; stage.style.width = Math.floor(Wd * s) + 'px'; stage.style.height = Math.ceil(screen.offsetHeight * s) + 'px'; }
  function setHash(){ var h = st.s + (st.open ? (st.view === 'day' ? '-ngay-' : '-lich-') + st.day : ''); if (location.hash !== '#' + h) history.replaceState(null, '', '#' + h); }
  function readHash(){ var m = /^#([a-z]+)(?:-(lich|ngay)(?:-(\d{4}-\d{2}-\d{2}))?)?$/.exec(location.hash); if (m && R[m[1]]) { st.s = m[1]; st.open = !!m[2]; st.view = m[2] === 'ngay' ? 'day' : 'month'; st.anim = 'pop'; if (m[3]) { st.day = m[3]; st.month = m[3].slice(0,7); } } }
  $('screens').innerHTML = S.map(function(s){ return '<button type="button" class="chip" data-s="' + s.k + '">' + s.t + '</button>'; }).join('') + '<button type="button" class="chip" data-cal aria-pressed="false">Lịch học (modal)<small>nút lịch nổi ở góc dưới, hoặc phím L</small></button>';
  document.addEventListener('click', function(e){ var b = e.target.closest('[data-s],[data-d],[data-dev]'); if (!b || screen.contains(b)) return; if (b.dataset.s) st.s = b.dataset.s; if (b.dataset.d) st.d = Number(b.dataset.d); if (b.dataset.dev) st.dev = b.dataset.dev; setHash(); render(); });
  document.addEventListener('click', function(e){ if (e.target.closest('[data-cal]')) { e.preventDefault(); openCal(); } });
  screen.addEventListener('click', function(e){ var t = e.target;
    if (t.closest('[data-fab]')) { openCal(); return; }
    if (t.closest('[data-close]')) { closeCal(); return; }
    if (t.closest('[data-back]')) { backToMonth(); return; }
    var sp = t.closest('[data-step]'); if (sp && !sp.disabled) { stepDay(Number(sp.dataset.step)); return; }
    var dy = t.closest('[data-day]'); if (dy) { openDay(dy.dataset.day); return; }
    var mo = t.closest('[data-mon]'); if (mo && !mo.disabled) { var p = st.month.split('-'), d = new Date(+p[0], +p[1] - 1 + Number(mo.dataset.mon), 1), last = iso(new Date(d.getFullYear(), d.getMonth() + 1, 0));
      st.month = iso(d).slice(0,7); st.day = last > TODAY ? TODAY : last; st.anim = false; setHash(); render(); focusSel('[data-mon="' + mo.dataset.mon + '"]'); return; }
    if (t.closest('[data-today]')) { selectDay(TODAY); return; }
    var f = t.closest('[data-f]'); if (f) { st.filt = f.dataset.f; st.anim = false; render(); focusSel('[data-f="' + st.filt + '"]'); }
  });
  document.addEventListener('keydown', function(e){ if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (st.open && st.view === 'day') {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); stepDay(e.key === 'ArrowLeft' ? -1 : 1); return; }
      if (e.key === 'Escape') { e.preventDefault(); backToMonth(); return; }
      if (e.key === 'l' || e.key === 'L') { e.preventDefault(); closeCal(); }
      return;
    }
    if (st.open) {
      var mv = { ArrowLeft:-1, ArrowRight:1, ArrowUp:-7, ArrowDown:7 }[e.key];
      if (mv) { e.preventDefault(); var d = toD(st.day); d.setDate(d.getDate() + mv); selectDay(iso(d)); return; }
      if (e.key === 'Escape' || e.key === 'l' || e.key === 'L') { e.preventDefault(); closeCal(); }
      return;
    }
    if (e.key === 'l' || e.key === 'L') { e.preventDefault(); openCal(); return; }
    var i = S.indexOf(cur());
    if (e.key === 'ArrowDown') st.s = S[(i + 1) % S.length].k; else if (e.key === 'ArrowUp') st.s = S[(i + S.length - 1) % S.length].k; else return;
    e.preventDefault(); setHash(); render(); });
  addEventListener('hashchange', function(){ readHash(); render(); });
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(stage.parentElement); else addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  readHash(); render();
})();
</script>
