<title>Polish nền và màn phụ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: chooser (7 screens × 5 background directions × 2 devices), one scaled device frame, audit + notes. Tokens: landing bản 3 with the navy accent chosen 08/11/2026. */
:root{
  --bg:#f6f7fa; --surface:#ffffff; --ink:#1b2444; --muted:#525a78; --line:#dde1ea; --ghost:#c9cedc;
  --accent:#1e3a8a; --accent-soft:#e7ecf8; --on-accent:#ffffff; --mark:#ffd84a; --mark-ink:#1b2444;
  --pass:#1b7a46; --pass-soft:#e4f2ea; --fail:#b8352a; --fail-soft:#f8e7e5; --frame:#e9ebf1;
  --f-display:'Bricolage Grotesque','Noto Sans',system-ui,sans-serif; --f-body:'Noto Sans',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(0.23,1,0.32,1); --shadow:0 24px 48px -30px rgb(27 36 68 / .5); --shadow-s:0 10px 24px -18px rgb(27 36 68 / .4);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131c; --surface:#1a1f2d; --ink:#eceef5; --muted:#a6adc4; --line:#2e3549; --ghost:#3a4157; --accent:#8da2ff; --accent-soft:#1f2747; --on-accent:#10131c;
  --pass:#62c98f; --pass-soft:#142a1e; --fail:#ff8d80; --fail-soft:#311a18; --frame:#0b0d14; --shadow:0 24px 48px -30px rgb(0 0 0 / .8); --shadow-s:0 10px 24px -18px rgb(0 0 0 / .7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131c; --surface:#1a1f2d; --ink:#eceef5; --muted:#a6adc4; --line:#2e3549; --ghost:#3a4157; --accent:#8da2ff; --accent-soft:#1f2747; --on-accent:#10131c;
  --pass:#62c98f; --pass-soft:#142a1e; --fail:#ff8d80; --fail-soft:#311a18; --frame:#0b0d14; --shadow:0 24px 48px -30px rgb(0 0 0 / .8); --shadow-s:0 10px 24px -18px rgb(0 0 0 / .7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--frame);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
mark{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px}
kbd{font-family:var(--f-mono);font-size:11px;font-weight:700;min-width:20px;height:20px;display:inline-grid;place-items:center;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg);color:var(--ink);line-height:1}
.mono{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:18px}
.intro{display:grid;gap:8px;max-width:76ch}
.intro h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.2}
.intro p{color:var(--muted)}
.vrow{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px}
.choose{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;text-align:left;transition:border-color .2s}
.chip small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.stage{position:relative;overflow:hidden;border-radius:20px;justify-self:center}
.scaler{transform-origin:top left;width:max-content}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.notes section{background:var(--surface);border-radius:16px;padding:16px 18px;display:grid;gap:6px;align-content:start}
.notes h3{font-size:16px;font-weight:700}
.notes ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px;color:var(--muted);line-height:1.5}
.notes b{color:var(--ink);font-weight:600}
@media (max-width:900px){.notes{grid-template-columns:1fr}}

/* ===== device, glass top bar ===== */
.dev{background:var(--bg);color:var(--ink);overflow:hidden;position:relative}
.dev.desk{width:1200px} .dev.phone{width:390px}
.ab{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;gap:28px;padding:0 32px;background:color-mix(in srgb,var(--surface) 62%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.logo{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.03em;display:inline-flex;align-items:baseline;gap:2px}
.logo i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.tabs{display:flex;gap:22px;font-size:15px;font-weight:500;color:var(--muted)}
.tabs span{position:relative;padding:20px 0} .tabs span.on{color:var(--ink);font-weight:600}
.tabs span.on::after{content:"";position:absolute;left:0;right:0;bottom:12px;height:2px;border-radius:2px;background:var(--ink)}
.cmd{margin-left:auto;display:flex;align-items:center;gap:8px;width:300px;height:40px;padding:0 10px 0 12px;border-radius:12px;background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--muted);font-size:14px}
.cmd span{flex:1}
.addw{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 14px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px}
.addw kbd,.btn kbd{background:transparent;color:inherit;border-color:rgb(255 255 255 / .45)}
.ava{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:14px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.phone .ab{height:56px;padding:0 16px;gap:12px} .phone .ab .sp{flex:1}
.tb{position:relative;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 0 10px}
.tb span{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding-top:4px}
.tb span.on{color:var(--ink);font-weight:700} .tb span.on .ic{stroke:var(--accent)}

/* ===== shared parts ===== */
.scr{position:relative;isolation:isolate;min-height:820px;padding:96px 60px 72px;margin-top:-64px;display:grid;gap:20px;align-content:start}
.phone .scr{padding:76px 16px 28px;margin-top:-56px;min-height:780px;gap:16px}
.scr > *{position:relative;z-index:1}
.scr::before,.scr::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none}
.pn{background:var(--surface);border-radius:18px;padding:22px;box-shadow:var(--shadow-s)}
.phone .pn{padding:16px;border-radius:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;white-space:nowrap;transition:transform .15s var(--ease),filter .2s}
.btn:hover{filter:brightness(1.12)} .btn:active{transform:scale(.97)}
.btn.ok{background:var(--pass)}
.lnk{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent);text-underline-offset:4px}
.lnk.mut{color:var(--muted);text-decoration-color:color-mix(in srgb,var(--muted) 35%,transparent)}
.lnk.bad{color:var(--fail);text-decoration-color:color-mix(in srgb,var(--fail) 35%,transparent)}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px;color:var(--accent)}
.back .ic{width:16px;height:16px}
.h1{font-family:var(--f-display);font-size:42px;font-weight:800;letter-spacing:-.035em;line-height:1.08}
.phone .h1{font-size:30px}
.sub{color:var(--muted);max-width:60ch}
.chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ghost);background:var(--surface);display:inline-grid;place-items:center;flex:none}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk .ic{width:12px;height:12px;stroke-width:3.4}
.chk.dis{opacity:.4}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:2px 0}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.ticks{display:flex;gap:3px}
.ticks i{width:14px;height:6px;border-radius:2px;background:var(--line)}
.ticks i.ok{background:var(--pass)} .ticks i.no{background:var(--fail)} .ticks i.now{background:var(--ink)}
.row2{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.sp{flex:1}
.big{font-family:var(--f-display);font-weight:800;letter-spacing:-.05em;line-height:.85;font-variant-numeric:tabular-nums}

/* ===== S1 · Từ tồn đọng ===== */
.s1 .hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.s1 .hd .big{font-size:96px;color:var(--fail);text-align:right}
.s1 .why{font-size:15px;color:var(--muted);max-width:76ch;line-height:1.65}
.s1 .why b{color:var(--ink);font-weight:600}
.s1 .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--accent-soft);margin-bottom:6px}
.s1 .bar b{font-weight:600}
.s1 .tr{display:grid;grid-template-columns:28px minmax(0,190px) minmax(0,1fr) 220px;gap:14px;align-items:center;padding:12px 14px;border-radius:10px}
.s1 .tr.h{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-block:6px}
.s1 .tr.sel{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.s1 .tr + .tr{border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.s1 .w{font-family:var(--f-display);font-weight:700;font-size:19px}
.s1 .od{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:10px;align-items:center}
.s1 .od span{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.s1 .od span b{display:block;height:100%;border-radius:3px;background:var(--fail)}
.s1 .od em{font-style:normal;white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:16px;text-align:right;color:var(--fail);font-variant-numeric:tabular-nums}
.phone .s1 .hd{grid-template-columns:1fr auto}
.phone .s1 .hd .big{font-size:60px}
.phone .s1 .tr{grid-template-columns:24px minmax(0,1fr) 70px;gap:10px}
.phone .s1 .tr .m{display:none}
.phone .s1 .od{grid-template-columns:1fr}
.phone .s1 .od span{display:none}

/* ===== S2 · Lịch sử ===== */
.s2 .tabs2{display:flex;gap:22px;align-items:center;border-bottom:1px solid var(--line)}
.s2 .tabs2 span{padding:10px 0;font-weight:600;color:var(--muted);font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px}
.s2 .tabs2 span.on{color:var(--ink);border-color:var(--ink)}
.s2 .day{display:grid;gap:10px}
.s2 .dh{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.s2 .dh h2{font-size:22px;font-weight:700}
.s2 .dh .sc{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.s2 .dh .sc small{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--muted);margin-left:4px;letter-spacing:0}
.s2 .hr{display:grid;grid-template-columns:52px minmax(0,140px) minmax(0,150px) minmax(0,1fr) minmax(0,130px) 26px 96px;gap:14px;align-items:center;padding:11px 12px;border-radius:10px;font-size:14.5px}
.s2 .hr + .hr{border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.s2 .hr.h{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-block:6px}
.s2 .hr .w{font-family:var(--f-display);font-weight:700;font-size:17px}
.s2 .hr .ty{color:var(--muted);font-size:13px}
.s2 .hr .q{color:var(--ink)}
.s2 .hr .a.ok{color:var(--pass);font-weight:600} .s2 .hr .a.no{color:var(--fail);font-weight:600}
.s2 .hr .a small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.s2 .hr .r{width:24px;height:24px;border-radius:7px;display:grid;place-items:center}
.s2 .hr .r.ok{background:var(--pass-soft);color:var(--pass)} .s2 .hr .r.no{background:var(--fail-soft);color:var(--fail)}
.s2 .hr .r .ic{width:14px;height:14px;stroke-width:3}
.s2 .hr .pr{color:var(--muted);font-size:13px}
.phone .s2 .hr{grid-template-columns:24px minmax(0,1fr) auto;gap:4px 10px}
.phone .s2 .hr.h{display:none}
.phone .s2 .hr .t,.phone .s2 .hr .ty,.phone .s2 .hr .pr{display:none}
.phone .s2 .hr .r{grid-row:1 / span 3;grid-column:1;align-self:start}
.phone .s2 .hr .w{grid-column:2}
.phone .s2 .hr .q{grid-column:2 / -1;font-size:14px;color:var(--muted)}
.phone .s2 .hr .a{grid-column:2 / -1}
.phone .s2 .tabs2{gap:14px;font-size:14px}
.phone .s2 .tabs2 span{font-size:14px;white-space:nowrap}
.phone .s2 .tabs2 span:last-child{display:none}
.phone .s2 .dh .ticks{width:100%}
.phone .s2 .dh .ticks i{flex:1;width:auto}

/* ===== S3 · Phiên luyện ===== */
.s3{justify-items:center}
.s3 .top{width:100%;max-width:760px;display:flex;align-items:center;gap:14px}
.s3 .x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.s3 .ticks{flex:1;display:grid;grid-template-columns:repeat(20,1fr);gap:3px} .s3 .ticks i{width:auto}
.s3 .q{width:100%;max-width:760px;padding:0;overflow:hidden}
.s3 .qi{padding:26px 30px 22px;display:grid;gap:14px}
.s3 .lab{display:flex;gap:8px;align-items:center}
.s3 .lab span{font-family:var(--f-mono);font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;background:var(--bg);color:var(--muted)}
.s3 .lab span.ai{background:var(--accent-soft);color:var(--accent)}
.s3 .sent{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:-.02em;line-height:1.3}
.s3 .ans{display:inline-block;padding:0 10px;border-radius:9px;border:2px solid var(--pass);background:var(--pass-soft);color:var(--pass)}
.s3 .tr2{font-size:14px;color:var(--muted)}
.s3 .hints{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.s3 .hints span{padding:3px 9px;border-radius:7px;border:1px solid var(--line)}
.s3 .hints span.on{background:var(--mark);border-color:var(--mark);color:var(--mark-ink);font-weight:600}
.s3 .fb{border-top:1px solid var(--line);background:color-mix(in srgb,var(--pass) 6%,var(--surface));padding:18px 30px 22px;display:grid;gap:12px}
.s3 .fb .t{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--pass)}
.s3 .fb .t .c{width:30px;height:30px;border-radius:50%;background:var(--pass);color:#fff;display:grid;place-items:center}
.s3 .fb .t .c .ic{width:16px;height:16px;stroke-width:3}
.s3 .fb .t small{margin-left:auto;font-family:var(--f-body);font-size:15px;font-weight:600;color:var(--ink)}
.s3 .mv{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.s3 .mv b{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:600}
.s3 .acts{display:flex;gap:16px;align-items:center;justify-content:flex-end}
.s3 .keys{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.s3 .keys span{display:inline-flex;gap:6px;align-items:center}
.phone .s3 .qi{padding:18px}
.phone .s3 .sent{font-size:24px}
.phone .s3 .fb{padding:16px 18px}
.phone .s3 .acts{justify-content:stretch} .phone .s3 .acts .btn{flex:1}
.phone .s3 .keys{display:none}
.phone .s3 .top > span:first-of-type{display:none}
.phone .s3 .top{gap:10px}

/* ===== S4 · Luyện tập ===== */
.s4 .hd{display:flex;align-items:end;gap:20px;flex-wrap:wrap}
.s4 .meter{margin-left:auto;display:grid;gap:6px;min-width:240px}
.s4 .meter .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.s4 .meter .bar b{display:block;height:100%;width:6.7%;background:var(--accent);border-radius:4px}
.s4 .grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.s4 .hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:center;padding:28px}
.s4 .hero .n{display:flex;align-items:baseline;gap:12px}
.s4 .hero .n .big{font-size:84px;color:var(--accent)}
.s4 .hero h2{font-size:28px;font-weight:800;letter-spacing:-.02em}
.s4 .prev{border-radius:16px;background:var(--bg);padding:16px;display:grid;gap:8px}
.s4 .prev .w{font-family:var(--f-display);font-weight:800;font-size:24px}
.s4 .opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-size:15px}
.s4 .opt.ok{border-color:var(--pass);background:var(--pass-soft)}
.s4 .opt kbd{min-width:22px}
.s4 .resume{display:flex;align-items:center;gap:14px;padding:14px 18px;flex-wrap:wrap}
.s4 .resume .pg{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--accent)}
.s4 .src h2{font-size:22px;font-weight:700;margin-bottom:6px}
.s4 .sr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px;align-items:center;padding:16px 4px}
.s4 .sr + .sr{border-top:1px solid color-mix(in srgb,var(--line) 75%,transparent)}
.s4 .sr h3{font-size:18px;font-weight:700}
.s4 .sr p{color:var(--muted);font-size:14.5px}
.s4 .sr .meta{grid-column:1;display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.s4 .sr .meta span{padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--ink)}
.s4 .sr .meta span.no{background:var(--fail-soft);color:var(--fail)}
.s4 .sr .go{grid-row:1 / span 3;grid-column:2}
.s4 .side{display:grid;gap:16px}
.s4 .side h3{font-size:16px;font-weight:700;margin-bottom:8px}
.s4 .rc{display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 10px;padding:6px 0;font-size:14px}
.s4 .rc .r{width:22px;height:22px;border-radius:7px;display:grid;place-items:center}
.s4 .rc .r.ok{background:var(--pass-soft);color:var(--pass)} .s4 .rc .r.no{background:var(--fail-soft);color:var(--fail)}
.s4 .rc .r .ic{width:12px;height:12px;stroke-width:3}
.s4 .rc b{font-weight:600} .s4 .rc small{grid-column:2;color:var(--muted);font-size:12.5px}
.s4 .ks{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:13.5px;align-items:center;color:var(--muted)}
.phone .s4 .grid,.phone .s4 .hero{grid-template-columns:1fr}
.phone .s4 .hero{padding:18px}
.phone .s4 .hero .n .big{font-size:60px}
.phone .s4 .meter{margin-left:0;width:100%}
.phone .s4 .side .keysbox{display:none}
