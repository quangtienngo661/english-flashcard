<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bố cục app tham khảo</title>
<style>
/* Reference sketches of 11 learning apps, rebuilt from their App Store screenshots (downloaded 17/10/2026).
   Internal research only: layout and colour approximations, no logos, mascots or copied artwork. */
:root { --ink: #16181d; --muted: #5b6070; --line: #dfe2ea; --bg: #eef0f5; --paper: #fff; --accent: #2445d6; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: inherit; }
.top { padding: 14px 20px; background: var(--ink); color: #fff; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
.top b { font-size: 17px; }
.top span { opacity: 0.75; font-size: 13px; }
.wrap { display: grid; grid-template-columns: 220px 395px minmax(0, 1fr); gap: 20px; padding: 20px; align-items: start; }
@media (max-width: 1100px) { .wrap { grid-template-columns: 1fr; } }
.apps { display: grid; gap: 4px; position: sticky; top: 12px; }
@media (max-width: 1100px) { .apps { position: static; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
.apps button { text-align: left; border: 0; background: var(--paper); border-radius: 10px; padding: 9px 12px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.apps button small { display: block; color: var(--muted); font-size: 12px; }
.apps button[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; }
.apps button[aria-pressed="true"] small { color: #c9cde0; }
.stage { display: grid; gap: 10px; justify-items: center; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.tabs button { border: 0; border-radius: 999px; padding: 6px 12px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; font-size: 13px; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: #fff; box-shadow: none; }
.phone { width: 375px; height: 780px; border: 9px solid #101114; border-radius: 46px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 10px 30px rgb(0 0 0 / 0.18); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.sb { height: 40px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 26px; font-size: 13px; font-weight: 600; }
.hint { font-size: 12px; color: var(--muted); text-align: center; max-width: 375px; }
.notes { background: var(--paper); border-radius: 16px; padding: 18px 22px; box-shadow: inset 0 0 0 1px var(--line); }
.notes h2 { margin: 0 0 4px; font-size: 22px; }
.notes .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.notes h3 { margin: 16px 0 6px; font-size: 15px; }
.notes ul { margin: 0; padding-left: 20px; }
.notes li { margin: 3px 0; }
.notes a { color: var(--accent); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; margin-right: 4px; vertical-align: 1px; }
.tag.seen { background: #e3f4ea; color: #1b7a46; } .tag.doc { background: #e7ecff; color: #2445d6; } .tag.guess { background: #fff1d6; color: #7a5200; } .tag.code { background: #ede4ff; color: #5b2bb5; }
.apps .sep { font-size: 12px; color: var(--muted); padding: 8px 4px 2px; }
.click { cursor: pointer; }
.ph { display: grid; place-items: center; color: rgb(0 0 0 / 0.35); font-size: 12px; text-align: center; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Duolingo-like ---------- */
.du { background: #fff; color: #4b4b4b; font-family: "Nunito", system-ui, sans-serif; }
.du-stats { display: flex; justify-content: space-between; padding: 6px 18px 10px; font-weight: 800; font-size: 14px; }
.du-stats span { display: flex; align-items: center; gap: 5px; }
.du-unit { margin: 0 14px; background: #58cc02; color: #fff; border-radius: 14px; display: flex; box-shadow: 0 4px 0 #46a302; }
.du-unit div { flex: 1; padding: 10px 14px; } .du-unit small { display: block; font-size: 11px; font-weight: 800; opacity: 0.85; letter-spacing: 0.04em; }
.du-unit b { font-size: 17px; } .du-unit .book { flex: none; width: 52px; display: grid; place-items: center; border-left: 2px solid rgb(0 0 0 / 0.12); }
.du-path { flex: 1; position: relative; overflow: hidden; }
.du-node { position: absolute; width: 66px; height: 60px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; }
.du-node.done { background: #58cc02; box-shadow: 0 6px 0 #46a302; }
.du-node.cur { background: #58cc02; box-shadow: 0 6px 0 #46a302, 0 0 0 8px #fff, 0 0 0 13px #e5e5e5; }
.du-node.lock { background: #e5e5e5; box-shadow: 0 6px 0 #c9c9c9; color: #afafaf; }
.du-start { position: absolute; background: #fff; border: 2px solid #e5e5e5; color: #58cc02; font-weight: 900; font-size: 13px; padding: 5px 10px; border-radius: 10px; }
.du-tabs { display: flex; justify-content: space-around; border-top: 2px solid #e5e5e5; padding: 8px 6px 22px; background: #fff; }
.du-tabs button { border: 0; background: none; width: 44px; height: 40px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; }
.du-tabs button[aria-current] { background: #ddf4ff; box-shadow: inset 0 0 0 2px #84d8ff; }
.du-ico { width: 24px; height: 24px; border-radius: 7px; }
.du-lesson-top { display: flex; align-items: center; gap: 12px; padding: 4px 16px 14px; }
.du-bar { flex: 1; height: 16px; border-radius: 8px; background: #e5e5e5; overflow: hidden; } .du-bar i { display: block; height: 100%; width: 45%; background: #58cc02; border-radius: 8px; }
.du-q { padding: 0 18px; font-size: 21px; font-weight: 800; color: #3c3c3c; }
.du-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 18px; }
.du-opt { border: 2px solid #e5e5e5; border-radius: 14px; box-shadow: 0 4px 0 #e5e5e5; padding: 12px; text-align: center; background: #fff; cursor: pointer; }
.du-opt .ph { height: 84px; background: #f7f7f7; border-radius: 10px; margin-bottom: 8px; }
.du-opt[aria-pressed="true"] { border-color: #84d8ff; background: #ddf4ff; box-shadow: 0 4px 0 #84d8ff; color: #1899d6; }
.du-check { margin: auto 16px 24px; height: 50px; border: 0; border-radius: 14px; font-weight: 900; letter-spacing: 0.05em; background: #58cc02; color: #fff; box-shadow: 0 4px 0 #46a302; cursor: pointer; }
.du-check:disabled { background: #e5e5e5; color: #afafaf; box-shadow: 0 4px 0 #c9c9c9; }
.du-streak { flex: 1; display: grid; place-content: center; text-align: center; gap: 6px; padding: 0 30px; }
.du-streak .n { font-size: 110px; font-weight: 900; color: #ff9600; line-height: 1; }
.du-week { display: flex; justify-content: space-between; border: 2px solid #e5e5e5; border-radius: 14px; padding: 10px 12px; margin-top: 14px; font-size: 12px; font-weight: 800; color: #afafaf; }
.du-week span { display: grid; gap: 6px; justify-items: center; } .du-week i { width: 22px; height: 22px; border-radius: 50%; background: #e5e5e5; } .du-week .on i { background: #ff9600; } .du-week .on { color: #ff9600; }
.du-head { padding: 14px 18px 16px; color: #fff; } .du-head h3 { margin: 0; font-size: 22px; font-weight: 900; } .du-head small { font-weight: 800; opacity: 0.85; }
.du-card { margin: 12px 16px; border: 2px solid #e5e5e5; border-radius: 16px; padding: 14px; }
.du-prog { height: 16px; border-radius: 8px; background: #e5e5e5; overflow: hidden; margin-top: 8px; } .du-prog i { display: block; height: 100%; border-radius: 8px; }
.du-row { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 2px solid #f0f0f0; font-weight: 700; }
.du-row.me { background: #d7ffb8; }
.du-av { width: 36px; height: 36px; border-radius: 50%; background: #ffd9c2; }

/* ---------- AnkiMobile-like ---------- */
.an { background: #ececec; color: #111; }
.an-bar { display: flex; justify-content: space-between; padding: 8px 22px 10px; color: #0a7aff; font-size: 16px; }
.an-card { flex: 1; display: grid; place-content: center; text-align: center; padding: 0 24px; font-size: 30px; }
.an-card .ans { font-size: 22px; color: #333; border-top: 1px solid #c8c8c8; padding-top: 14px; margin-top: 14px; }
.an-counts { text-align: center; padding: 12px 0 26px; font-size: 18px; background: #f7f7f7; border-top: 1px solid #d4d4d4; cursor: pointer; }
.an-counts .n { color: #1e6ff0; } .an-counts .l { color: #d23b2f; text-decoration: underline; } .an-counts .r { color: #23a447; }
.an-gear { position: absolute; right: 18px; bottom: 90px; color: #0a7aff; }
.an-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 6px 4px 26px; background: #f7f7f7; }
.an-btns button { border: 0; border-radius: 6px; color: #fff; padding: 8px 0; cursor: pointer; line-height: 1.2; }
.an-btns small { display: block; font-size: 13px; opacity: 0.9; }
.an-decks { background: #f2f2f7; }
.an-nav { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 10px; color: #0a7aff; }
.an-nav b { color: #111; font-size: 17px; }
.an-list { margin: 8px 14px; background: #fff; border-radius: 12px; overflow: hidden; }
.an-deck { display: flex; align-items: center; padding: 12px 14px; border-bottom: 1px solid #e4e4e8; gap: 10px; cursor: pointer; }
.an-deck .name { flex: 1; } .an-deck .c { width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
.an-sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #1f1f21; color: #fff; border-radius: 16px 16px 0 0; padding: 12px 12px 28px; }
.an-sheet .g { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.an-sheet .g span { background: #343436; border-radius: 8px; padding: 10px 4px; text-align: center; font-size: 13px; }

/* ---------- Quizlet-like ---------- */
.qz { background: #f6f7fb; color: #2e3856; }
.qz-hero { background: #4a5af5; color: #fff; padding: 6px 16px 18px; border-radius: 0 0 22px 22px; }
.qz-hero .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.qz-logo { width: 74px; height: 22px; border-radius: 6px; background: rgb(255 255 255 / 0.35); }
.qz-search { display: flex; gap: 8px; align-items: center; background: #fff; color: #586380; border-radius: 12px; padding: 11px 12px; }
.qz-sec { display: flex; justify-content: space-between; padding: 16px 16px 8px; font-weight: 700; } .qz-sec a { color: #4255ff; font-size: 13px; }
.qz-hscroll { display: flex; gap: 10px; padding: 0 16px; overflow: hidden; }
.qz-tile { flex: none; width: 210px; background: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 1px 3px rgb(46 56 86 / 0.12); cursor: pointer; }
.qz-tile small { color: #586380; display: block; }
.qz-pill { display: inline-block; background: #edeff4; border-radius: 99px; padding: 1px 8px; font-size: 11px; margin-top: 8px; }
.qz-tabs { margin-top: auto; display: flex; justify-content: space-around; background: #fff; border-top: 1px solid #e5e7ef; padding: 8px 0 22px; font-size: 11px; color: #586380; }
.qz-tabs span { display: grid; justify-items: center; gap: 2px; } .qz-tabs .on { color: #4255ff; }
.qz-plus { width: 40px; height: 40px; border-radius: 50%; background: #4255ff; color: #fff; display: grid; place-items: center; margin-top: -4px; }
.qz-topnav { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 10px; }
.qz-prev { margin: 0 16px; background: #fff; border-radius: 16px; height: 170px; display: grid; place-items: center; padding: 18px; text-align: center; font-size: 17px; box-shadow: 0 1px 3px rgb(46 56 86 / 0.12); }
.qz-dots { display: flex; gap: 5px; justify-content: center; padding: 10px; } .qz-dots i { width: 6px; height: 6px; border-radius: 50%; background: #c6cbd8; } .qz-dots i:first-child { background: #4255ff; }
.qz-title { padding: 6px 16px 2px; font-size: 24px; font-weight: 800; }
.qz-mode { display: flex; gap: 12px; align-items: center; margin: 8px 16px 0; background: #fff; border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 3px rgb(46 56 86 / 0.12); cursor: pointer; }
.qz-mode i { width: 30px; height: 30px; border-radius: 8px; background: #e6e9ff; } .qz-mode small { display: block; color: #586380; }
.qz-fc-top { display: flex; justify-content: space-between; align-items: center; padding: 4px 16px 10px; font-weight: 700; }
.qz-counts { display: flex; justify-content: space-between; padding: 0 0 10px; }
.qz-counts span { min-width: 44px; padding: 3px 12px; font-weight: 800; text-align: center; }
.qz-counts .k { background: #fff1e5; color: #ff8a00; border-radius: 0 99px 99px 0; border: 2px solid #ff8a00; border-left: 0; }
.qz-counts .g { background: #e3f6ec; color: #23b26d; border-radius: 99px 0 0 99px; border: 2px solid #23b26d; border-right: 0; }
.qz-cardwrap { flex: 1; position: relative; margin: 6px 16px 10px; touch-action: none; }
.qz-card { position: absolute; inset: 0; background: #fff; border-radius: 18px; box-shadow: 0 2px 10px rgb(46 56 86 / 0.15); display: grid; place-items: center; text-align: center; padding: 20px; font-size: 26px; cursor: grab; user-select: none; transition: transform 0.2s; overflow: hidden; }
.qz-card .ov { position: absolute; top: 0; left: 0; right: 0; padding: 12px; font-weight: 800; color: #fff; opacity: 0; }
.qz-card.right .ov.k { opacity: 1; background: #23b26d; } .qz-card.left .ov.s { opacity: 1; background: #ff8a00; }
.qz-fc-btns { display: flex; justify-content: space-between; align-items: center; padding: 6px 24px 26px; }
.qz-fc-btns button { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #d9dde8; background: #fff; cursor: pointer; font-size: 20px; }
.qz-learn { padding: 0 16px; } .qz-learn .chip { display: inline-block; background: #fde8d9; color: #b65a12; border-radius: 99px; padding: 2px 10px; font-size: 12px; font-weight: 700; margin: 4px 0 10px; }
.qz-opt { border: 2px solid #e5e7ef; border-radius: 12px; padding: 13px 14px; margin-top: 8px; background: #fff; cursor: pointer; }
.qz-opt.ok { border-color: #23b26d; background: #e3f6ec; color: #11734a; font-weight: 700; }

/* ---------- MochiVocab-like ---------- */
.mo { background: #fff; color: #263238; }
.mo-head { display: flex; justify-content: center; align-items: center; padding: 6px 16px 10px; position: relative; font-weight: 900; color: #f2b705; letter-spacing: 0.02em; }
.mo-head .av { position: absolute; right: 16px; width: 30px; height: 30px; border-radius: 50%; background: #ffe7b3; }
.mo-chip { margin: 10px auto 0; background: #f1f3f6; border-radius: 99px; padding: 6px 14px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.mo-chip i { width: 20px; height: 20px; border-radius: 5px; background: #ff7a7a; }
.mo-chart { display: flex; gap: 12px; align-items: flex-end; justify-content: center; height: 230px; padding: 0 26px; margin-top: 14px; }
.mo-col { display: grid; justify-items: center; gap: 4px; font-size: 12px; color: #607d8b; }
.mo-col b { width: 42px; border-radius: 10px 10px 4px 4px; display: block; }
.mo-col em { font-style: normal; font-size: 14px; color: #37474f; font-weight: 700; }
.mo-ready { text-align: center; font-weight: 800; margin-top: 18px; font-size: 16px; }
.mo-timer { margin: 8px auto 0; background: #9e9e9e; color: #fff; border-radius: 12px; padding: 8px 18px; font-weight: 800; display: flex; gap: 8px; align-items: center; }
.mo-go { margin: 14px auto 0; background: #58b947; color: #fff; border: 0; border-radius: 99px; padding: 11px 26px; font-weight: 800; box-shadow: 0 4px 0 #3f9330; cursor: pointer; }
.mo-tabs { margin-top: auto; display: flex; justify-content: space-around; align-items: flex-end; border-top: 1px solid #eceff1; padding: 6px 4px 20px; font-size: 10px; color: #78909c; background: #fff; }
.mo-tabs span { display: grid; justify-items: center; gap: 2px; width: 64px; text-align: center; cursor: pointer; }
.mo-tabs .mid { color: #263238; font-weight: 700; } .mo-tabs .mid i { width: 46px; height: 46px; border-radius: 50%; background: #fff; box-shadow: 0 -2px 8px rgb(0 0 0 / 0.12); display: grid; place-items: center; margin-top: -22px; }
.mo-learn-top { display: flex; align-items: center; gap: 10px; padding: 4px 16px 12px; }
.mo-learn-top .bar { flex: 1; height: 12px; border-radius: 6px; background: #eceff1; overflow: hidden; } .mo-learn-top .bar i { display: block; width: 30%; height: 100%; background: #ffc107; }
.mo-card { margin: 0 18px; border-radius: 18px; box-shadow: 0 2px 12px rgb(0 0 0 / 0.1); padding: 14px; text-align: center; }
.mo-card .img { height: 220px; border-radius: 12px; background: linear-gradient(135deg, #b2dfdb, #ffe082); margin: 10px 0 14px; }
.mo-card u { text-decoration-thickness: 2px; font-weight: 800; }
.mo-audio { display: flex; gap: 8px; justify-content: center; } .mo-audio i { width: 34px; height: 34px; border-radius: 50%; background: #fff3cd; }
.mo-know { display: block; text-align: center; color: #607d8b; font-size: 13px; text-decoration: underline; margin-top: 10px; }
.mo-dict-search { margin: 4px 14px 6px; display: flex; gap: 8px; align-items: center; border: 1.5px solid #cfd8dc; border-radius: 12px; padding: 9px 12px; }
.mo-entry { padding: 8px 16px; }
.mo-entry h4 { margin: 4px 0; font-size: 20px; }
.mo-pr { display: flex; gap: 10px; font-size: 13px; color: #546e7a; margin: 2px 0; } .mo-pr b { color: #42a5f5; font-weight: 600; width: 40px; }
.mo-sense { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #eceff1; font-size: 14px; }
.mo-sense small { display: block; color: #78909c; }
.mo-save { flex: none; background: #58b947; color: #fff; border: 0; border-radius: 99px; padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
.mo-course { margin: 8px 14px; border-radius: 14px; padding: 12px 14px; border: 1.5px solid #e0e0e0; }
.mo-course.on { background: #ffc94a; border-color: #ffc94a; }
.mo-course b { display: block; } .mo-course small { display: block; color: #455a64; margin-top: 3px; }

/* ---------- Drops-like ---------- */
.dr { background: #4b1f86; color: #fff; }
.dr-top { display: flex; justify-content: space-between; align-items: center; padding: 4px 18px 10px; }
.dr-flag { width: 30px; height: 30px; border-radius: 50%; background: #ffd54f; }
.dr-sec { margin: 6px 16px; background: #5c2d9e; border-radius: 99px; padding: 12px 18px; font-weight: 800; letter-spacing: 0.06em; font-size: 13px; display: flex; justify-content: space-between; }
.dr-word { display: flex; align-items: center; gap: 12px; padding: 12px 22px; cursor: pointer; }
.dr-word .pic { width: 44px; height: 44px; border-radius: 50%; background: #7b4cc0; }
.dr-word .t { flex: 1; } .dr-word small { display: block; opacity: 0.7; }
.dr-word .p { height: 4px; width: 90px; border-radius: 2px; background: #6d42ad; margin-top: 6px; } .dr-word .p i { display: block; height: 100%; background: #fff; border-radius: 2px; }
.dr-game { background: #2f6fdc; flex: 1; display: flex; flex-direction: column; }
.dr-game .bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 18px; }
.dr-game .pause { width: 30px; height: 30px; border-radius: 50%; background: rgb(0 0 0 / 0.2); display: grid; place-items: center; }
.dr-illu { width: 190px; height: 190px; margin: 40px auto 18px; border-radius: 40% 60% 55% 45%; background: rgb(255 255 255 / 0.85); }
.dr-big { text-align: center; font-size: 34px; font-weight: 700; }
.dr-yesno { margin-top: auto; display: flex; justify-content: space-between; padding: 0 40px 50px; }
.dr-yesno button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgb(255 255 255 / 0.6); background: rgb(255 255 255 / 0.12); color: #fff; font-size: 26px; cursor: pointer; }
.dr-detail .card { margin: 24px 18px 10px; background: #5c2d9e; border-radius: 16px; }
.dr-detail .card div { display: flex; justify-content: space-between; padding: 16px; font-size: 22px; font-weight: 800; }
.dr-detail .card div + div { border-top: 1px solid rgb(255 255 255 / 0.15); font-size: 15px; font-weight: 400; opacity: 0.8; }
.dr-pills { display: flex; gap: 10px; padding: 0 18px; } .dr-pills span { border: 1.5px solid rgb(255 255 255 / 0.4); border-radius: 99px; padding: 6px 14px; font-size: 14px; }
.dr-about { margin: 18px; background: #5c2d9e; border-radius: 16px; padding: 16px; font-size: 14px; } .dr-about b { display: block; font-size: 12px; letter-spacing: 0.08em; margin-bottom: 6px; }

/* ---------- Memrise-like ---------- */
.me { background: #fff; color: #1f2430; }
.me-top { display: flex; justify-content: space-between; align-items: center; padding: 4px 16px 10px; font-weight: 700; }
.me-seg { margin: 0 16px; display: grid; grid-template-columns: 1fr 1fr; background: #eef0f3; border-radius: 10px; padding: 3px; font-size: 13px; text-align: center; }

  if (s === 'deck' || s === 'opts') return `<div class="screen mx mx-white">${sb()}<div class="mx-body"><div class="mx-dhead"><h3>Tiếng Anh giao tiếp</h3><div style="color:#757575;font-size:14px">Các mẫu câu dùng hằng ngày</div><div class="row"><span>Tổng số thẻ:</span><span class="mx-pill">25</span></div></div>

  const top = (n = '1/5', w = 20) => `<div class="mx-study-top"><b>Tiếng Anh giao tiếp</b><div class="mx-prog"><i style="width:${w}%"></i></div><div style="text-align:right;font-size:14px;margin-top:4px">${n}</div></div>`;

  if (s === 'f') return `<div class="screen mx mx-white">${sb()}${top()}<div class="mx-fc" data-go="b"><div class="front">How are you?</div><small style="text-align:center;color:#9e9e9e">chạm để lật thẻ</small></div>${navb}</div>`;

    <div class="mx-grade"><button style="background:#d32f2f" data-go="f">Xem lại</button><button style="background:#f57c00" data-go="f">Khó</button><button style="background:#fbc02d" data-go="f">Vừa</button><button style="background:#388e3c" data-go="sum">Dễ</button></div></div>${navb}</div>`;
  if (s === 'mc') return `<div class="screen mx mx-white">${sb()}${top('2/5', 40)}<div class="mx-mc"><div style="color:#009688;font-weight:600">Chọn đáp án đúng</div><div style="font-size:18px;margin-bottom:8px">"Excuse me" thường dùng khi nào?</div>
    ${['Khi muốn gây chú ý lịch sự', 'Khi chào tạm biệt', 'Khi cảm ơn', 'Khi xin lỗi vì đến muộn'].map((o, i) => `<button class="${st.picked ? (i === 0 ? 'ok' : st.picked === String(i) ? 'bad' : '') : ''}" data-pick="${i}">${o}</button>`).join('')}</div>${navb}</div>`;
  if (s === 'fill') return `<div class="screen mx mx-white">${sb()}${top('3/5', 60)}<div class="mx-fc" data-go="sum"><small style="color:#888">Điền từ vào chỗ trống</small><div class="back" style="font-size:22px">She _____ to school every day.</div><div class="mx-input">Nhập đáp án của bạn</div><small style="color:#888;margin-top:8px">Nhập đáp án và nhấn vào thẻ để xem kết quả</small></div>${navb}</div>`;
  if (s === 'sum') return `<div class="screen mx">${sb()}<div class="mx-body"><div class="mx-sum-head"><div class="ok">✓</div><b style="font-size:24px">Hoàn thành học tập!</b><div style="color:#b2dfdb">Tiếng Anh giao tiếp</div></div>
    <div class="mx-box"><b style="font-size:18px">Tổng quan</b><div class="mx-3"><span><b style="color:#009688">5</b><small>Tổng thẻ</small></span><span><b style="color:#8bc34a">4</b><small>Đúng</small></span><span><b style="color:#ff9800">80%</b><small>Độ chính xác</small></span></div>
    <div style="margin-top:12px;font-size:14px">Tiến độ học tập</div><div class="mx-prog"><i style="width:80%"></i></div><small style="color:#757575">4/5 thẻ (80%)</small></div>
    <div class="mx-box" style="display:flex;align-items:center;gap:12px">⏱<div style="flex:1"><b>Thời gian học</b><div style="color:#757575;font-size:14px">2 phút 10 giây</div></div><span style="color:#ff9800">~26s/thẻ</span></div>
    <div style="margin:0 16px"><button class="mx-btn" style="background:#fff;color:#009688;border:2px solid #009688" data-go="home">Quay về bộ thẻ</button></div></div></div>`;
  if (s === 'lib') return `<div class="screen mx">${sb('#fff')}<div class="mx-body"><div class="mx-lib-head"><h3>📚 Thư viện Deck</h3><p>Khám phá hàng nghìn bộ flashcard chất lượng</p><div class="mx-lib-search">${ic('search', 18)}<span>Tìm deck yêu thích của bạn...</span><i></i></div></div>
    <div class="mx-hdr"><b style="font-size:16px">✨ Khám phá các bộ deck tuyệt vời</b><span class="mx-spin">Tất cả ⌄</span></div>
    ${[['English Regular Expressions', '598 thẻ', 'Learn common English expressions and idioms', 'Nguyễn Văn A'], ['Environment Vocabulary', '120 thẻ', 'Intermediate vocabulary for B2 level', 'Trần B']].map(([n, c, d, a]) => `<div class="mx-ldeck"><div class="t"><b>${n}</b><span class="mx-badge" style="background:#009688">${c}</span></div><span class="mx-badge" style="background:#ff9800;display:inline-block;margin-top:6px;border-radius:8px;font-size:11px">Ngôn ngữ</span><div class="mx-desc">${d}</div><div class="f"><span>👤 ${a}</span><span class="mx-badge" style="background:#8bc34a;border-radius:16px">Clone</span></div></div>`).join('')}</div>${nav('lib')}</div>`;
  if (s === 'stats') return `<div class="screen mx">${sb()}<div class="mx-body"><div style="padding:16px 16px 12px;font-size:24px;font-weight:700">Thống kê học tập</div>
    <div class="mx-streaks"><div style="background:linear-gradient(135deg,#8bc34a,#009688)"><small>Streak hiện tại</small><b>4 ngày</b><small>Tiếp tục phát huy!</small></div><div style="background:linear-gradient(45deg,#ff9800,#e65100)"><small>Streak dài nhất</small><b>12 ngày</b><small>Kỷ lục cá nhân</small></div></div>
    <div class="mx-box"><b>Thống kê 7 ngày qua</b><div class="mx-bars">${[30, 55, 20, 70, 45, 90, 60].map((h) => `<i style="height:${h}%"></i>`).join('')}</div><div class="mx-strip" style="background:#009688"><span>Tổng số cards<b>146 cards</b></span><span>Trung bình/ngày<b>21 cards</b></span></div></div>
    <div class="mx-box"><b>Xu hướng 30 ngày qua</b><svg viewBox="0 0 300 90" style="width:100%;height:90px"><polyline fill="none" stroke="#ff9800" stroke-width="3" points="0,70 30,60 60,65 90,40 120,50 150,30 180,45 210,25 240,35 270,15 300,20"/></svg><div class="mx-strip" style="background:#ff9800"><span>Tổng số cards<b>520 cards</b></span><span>Trung bình/ngày<b>17 cards</b></span></div></div></div>${nav('stats')}</div>`;
  if (s === 'share') return `<div class="screen mx">${sb('#fff')}<div class="mx-body"><div class="mx-share-head"><h3>Chia sẻ bộ thẻ</h3><p>Quản lý các lời mời chia sẻ</p></div>
    ${[['A', 'Anonymous User', 'Environment Vocabulary', 'Intermediate vocabulary for B2 level', '7 giờ trước'], ['L', 'Lan Nguyễn', 'IELTS Writing Task 2', 'Từ nối và cụm từ học thuật', '1 ngày trước']].map(([a, n, d, de, t]) => `<div class="mx-inv"><div class="h"><span class="mx-av">${a}</span><b>${n}</b><span class="mx-status">Chờ duyệt</span></div><div class="d"><b>${d}</b>${de}<div style="color:#009688;margin-top:4px;font-size:12px">Quyền: Xem</div></div>
      <div class="a"><button style="border:1px solid #bdbdbd;background:#fff;color:#757575">Từ chối</button><button style="border:0;background:#009688;color:#fff">Chấp nhận</button></div><div style="text-align:right;font-size:11px;color:#757575;margin-top:6px">${t}</div></div>`).join('')}</div>${nav('share')}</div>`;
  if (s === 'profile') return `<div class="screen mx">${sb('#fff')}<div class="mx-body"><div class="mx-tool">Hồ sơ</div>
    <div class="mx-sect"><h4>Thông tin tài khoản</h4><div style="display:flex;gap:14px;align-items:center"><span style="width:70px;height:70px;border-radius:50%;background:#b2dfdb"></span><div><b style="font-size:18px">Nguyen Van A</b><div style="font-size:14px">nguyenvana@example.com</div><div style="font-size:14px">+84 123 456 789</div></div></div><button class="mx-btn" style="background:#8bc34a;margin-top:12px;padding:10px">Chỉnh sửa hồ sơ</button></div>
    <div class="mx-sect"><h4>Cài đặt tài khoản</h4><div class="mx-row"><i></i><span>Đổi mật khẩu</span>›</div><div class="mx-row"><i></i><span>Phương pháp học tập</span><small style="color:#ff9800">Spaced Repetition</small>›</div></div>
    <div style="margin:12px 16px"><button class="mx-btn" style="background:#ff9800" data-go="login">Đăng xuất</button></div></div>${nav('profile')}</div>`;
  if (s === 'login') return `<div class="screen mx">${sb('#fff')}<div class="mx-login"><div class="logo"></div><div class="cardx"><h3>Chào mừng tới Memorix</h3><div class="sub">Đăng nhập để tiếp tục</div><div class="mx-field">Tài khoản</div><div class="mx-field">Mật khẩu</div>
    <div style="display:flex;justify-content:space-between;font-size:14px;margin-top:12px"><span>☐ Nhớ mật khẩu</span><span style="color:#ff9800">Quên mật khẩu?</span></div><button class="mx-btn" style="background:#009688;margin-top:14px;height:60px" data-go="home">Đăng nhập</button>
    <div style="text-align:center;color:#888;font-size:13px;margin:12px 0">------Hoặc truy cập nhanh------</div><button class="mx-btn" style="background:#4285f4">Đăng nhập với Google</button><div style="text-align:center;font-size:14px;margin-top:12px">Bạn chưa có tài khoản? <span style="color:#8bc34a">Đăng kí</span></div></div></div></div>`;
};

const appsEl = document.getElementById('apps'), tabsEl = document.getElementById('tabs'), phone = document.getElementById('phone'), notesEl = document.getElementById('notes'), hint = document.getElementById('hint');
const cur = () => APPS.find((a) => a.key === st.app);
function paintApps() { appsEl.innerHTML = APPS.map((a) => `${a.sep ? `<div class="sep">${a.sep}</div>` : ''}<button data-app="${a.key}" aria-pressed="${a.key === st.app}">${a.name}<small>${a.meta}</small></button>`).join(''); }
function paintNotes() { const a = cur(), n = a.notes;
  notesEl.innerHTML = `<h2>${a.name}</h2><div class="meta">${a.meta}${a.store ? ` · <a href="${a.store}" target="_blank" rel="noopener">App Store</a>` : ''}</div>
    <h3>Bố cục</h3><ul>${n.layout.map((l) => `<li>${l}</li>`).join('')}</ul><h3>Thử trong bản demo</h3><ul>${n.actions.map((l) => `<li>${l}</li>`).join('')}</ul>
    <h3>Ghi chú</h3><p style="margin:0">${n.note}</p>${n.src.length ? `<h3>Nguồn khác</h3><ul>${n.src.map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${t}</a></li>`).join('')}</ul>` : ''}
    <p style="margin-top:14px;font-size:12px;color:var(--muted)"><span class="tag seen">thấy trong ảnh</span>có trong ảnh App Store hoặc ảnh blog chính thức. <span class="tag doc">theo tài liệu</span>đọc từ tài liệu, không có ảnh. <span class="tag code">đọc từ code</span>dựng từ file layout XML của dự án. <span class="tag guess">phỏng đoán</span>chưa kiểm chứng.</p>`; }
function paint() { const a = cur();
  tabsEl.innerHTML = a.screens.map(([k, l]) => `<button data-screen="${k}" aria-pressed="${k === st.screen}">${l}</button>`).join('');
  phone.innerHTML = R[a.key](st.screen); hint.textContent = 'Bấm vào các phần tử trong điện thoại để chuyển màn.';
  if (a.key === 'quizlet' && st.screen === 'fc') bindDrag(); }
function bindDrag() { const card = document.getElementById('qzcard'); let x0 = null;
  card.addEventListener('pointerdown', (e) => { x0 = e.clientX; card.setPointerCapture(e.pointerId); card.style.transition = 'none'; });
  card.addEventListener('pointermove', (e) => { if (x0 === null) return; const dx = e.clientX - x0; card.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`; card.classList.toggle('right', dx > 40); card.classList.toggle('left', dx < -40); });
  card.addEventListener('pointerup', (e) => { const dx = e.clientX - x0; x0 = null; card.style.transition = ''; if (Math.abs(dx) > 90) swipe(dx > 0 ? 'right' : 'left'); else { card.style.transform = ''; card.classList.remove('right', 'left'); } }); }
function swipe(dir) { if (dir === 'right') st.qz.g++; else st.qz.k++; st.qz.n = Math.min(20, st.qz.n + 1); paint(); }
appsEl.addEventListener('click', (e) => { const b = e.target.closest('[data-app]'); if (!b) return; st.app = b.dataset.app; st.screen = cur().screens[0][0]; st.picked = null; st.pop = null; paintApps(); paintNotes(); paint(); });
tabsEl.addEventListener('click', (e) => { const b = e.target.closest('[data-screen]'); if (!b) return; st.screen = b.dataset.screen; st.pop = null; paint(); });
phone.addEventListener('click', (e) => { const t = e.target.closest('[data-go],[data-pick],[data-qz],[data-rate],[data-next],[data-pop],[data-toast]'); if (!t) { if (st.pop) { st.pop = null; paint(); } return; }
  const d = t.dataset;
  if (d.pick) { st.picked = d.pick; paint(); return; }
  if (d.qz) { swipe(d.qz); return; }
  if (d.rate) { st.bsDots.push(+d.rate); if (st.bsDots.length > 10) st.bsDots = [+d.rate]; st.screen = 'rated'; paint(); return; }
  if (d.next) { st.vi = (st.vi || 0) + 1; paint(); return; }
  if (d.pop) { st.pop = t.textContent; paint(); return; }
  if (d.toast) { t.textContent = '✓ Đã lưu'; t.style.background = '#2e7d32'; return; }
  if (d.go) { st.screen = d.go; st.picked = null; st.pop = null; paint(); } });
paintApps(); paintNotes(); paint();
</script>
