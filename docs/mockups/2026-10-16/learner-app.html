<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordmet: mockup app người học (Bước 3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
/* Mockup only (Bước 3 brainstorm, 16/10/2026). Colours copied from packages/design-tokens/theme.css (direction B). */
:root {
  --primary: #2445d6; --primary-deep: #1a32a6; --primary-soft: #eceffe;
  --accent: #ffd84a; --accent-deep: #c9a21a; --accent-soft: #fff4c7;
  --ink: #0f1a3d; --muted: #4d5577; --placeholder: #5f6688;
  --surface: #ffffff; --canvas: #f1f3fd; --border: #e3e6f4; --border-strong: #7d84a8;
  --success: #1b7a46; --success-soft: #e3f4ea; --warning: #7a5200;
  --danger: #b8352a; --danger-soft: #fde8e5; --neutral-soft: #eef0f5;
  --d-instant: 100ms; --d-fast: 150ms; --d-base: 250ms; --d-slow: 400ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1); --ease-enter: cubic-bezier(0.05, 0.7, 0.1, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --font: 'Lexend', system-ui, sans-serif;
}
/* Style 1 "Năng lượng": same as the landing (blue field, yellow sticker buttons, solid ledges, tilted card). */
.s-energy { --app-bg: var(--canvas); --hdr-bg: var(--primary); --hdr-fg: #fff; --hdr-sub: #dfe5ff;
  --main-bg: var(--accent); --main-fg: var(--ink); --main-ledge: var(--accent-deep);
  --card-ledge: 0 0.9rem 0 var(--primary-deep); --card-rot: -1.2deg; --panel-ledge: 0 0.3rem 0 var(--border);
  --h-weight: 800; --tab-active-bg: var(--accent); --tab-active-fg: var(--ink); }
/* Style 2 "Tập trung": white app, blue only for actions, flat card with a thin ledge, no tilt. */
.s-calm { --app-bg: #ffffff; --hdr-bg: #ffffff; --hdr-fg: var(--ink); --hdr-sub: var(--muted);
  --main-bg: var(--primary); --main-fg: #fff; --main-ledge: var(--primary-deep);
  --card-ledge: 0 0.3rem 0 var(--border); --card-rot: 0deg; --panel-ledge: 0 0 0 transparent;
  --h-weight: 600; --tab-active-bg: var(--primary-soft); --tab-active-fg: var(--primary); }

* { box-sizing: border-box; }
body { margin: 0; background: #dfe3f3; color: var(--ink); font: 400 1rem/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.toolbar { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; padding: 0.75rem 1rem; background: var(--ink); color: #fff; font-size: 0.875rem; }
.toolbar .grp { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
.toolbar button { border: 1px solid #3a4677; background: transparent; color: #fff; border-radius: 0.5rem; padding: 0.35rem 0.6rem; cursor: pointer; }
.toolbar button[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); }
.toolbar .lbl { opacity: 0.7; }

.stage { display: flex; justify-content: center; padding: 1.5rem 1rem 3rem; }
.frame { width: 390px; height: 800px; border: 10px solid var(--ink); border-radius: 2.5rem; overflow: hidden; background: var(--app-bg); container-type: inline-size; position: relative; display: flex; }
.frame.wide { width: min(1120px, 100%); height: 720px; border-width: 6px; border-radius: 1rem; }

.app { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.appbar { background: var(--hdr-bg); color: var(--hdr-fg); padding: 0.9rem 1.1rem; display: flex; align-items: center; gap: 0.75rem; border-bottom: 1px solid var(--border); }
.s-energy .appbar { border-bottom: 0; }
.appbar h1 { margin: 0; font-size: 1.25rem; font-weight: var(--h-weight); letter-spacing: -0.01em; flex: 1; }
.appbar .sub { font-size: 0.8125rem; color: var(--hdr-sub); }
.appbar .back { border: 0; background: transparent; color: inherit; font-size: 1.25rem; cursor: pointer; padding: 0.25rem 0.4rem; border-radius: 0.5rem; }
.logo-mark { background: var(--accent); color: var(--ink); padding: 0.05rem 0.4rem; border-radius: 0.35rem; font-weight: 800; font-size: 0.8rem; letter-spacing: 0.08em; }
.content { flex: 1; overflow-y: auto; padding: 1rem 1.1rem 1.5rem; }

.tabbar { order: 2; display: flex; justify-content: space-around; gap: 0.25rem; padding: 0.4rem 0.4rem 0.7rem; background: var(--surface); border-top: 1px solid var(--border); }
.tab { flex: 1; border: 0; background: transparent; padding: 0.45rem 0.2rem; border-radius: 0.75rem; font-size: 0.75rem; font-weight: 500; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; }
.tab .ic { font-size: 1.15rem; line-height: 1; }
.tab[aria-current="page"] { background: var(--tab-active-bg); color: var(--tab-active-fg); }
.tab.add { color: var(--primary); }
.side-logo { display: none; }

@container (min-width: 760px) {
  .frame .frame-inner { flex-direction: row; }
  .tabbar { order: -1; flex-direction: column; justify-content: flex-start; width: 13.5rem; padding: 1rem 0.75rem; border-top: 0; border-right: 1px solid var(--border); gap: 0.35rem; }
  .tab { flex: none; flex-direction: row; justify-content: flex-start; gap: 0.6rem; font-size: 0.9375rem; padding: 0.6rem 0.75rem; }
  .side-logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; padding: 0 0.5rem 1rem; }
  .content { padding: 1.5rem 2rem; }
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.85rem; }
  .cols > .group { margin: 0; }
}
.frame-inner { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; min-height: 2.9rem; padding: 0 1.1rem; border: 0; border-radius: 0.875rem; font-weight: 600; cursor: pointer; transition: transform var(--d-instant) var(--ease-standard), box-shadow var(--d-instant) var(--ease-standard); }
.btn:active { transform: translateY(0.2rem); box-shadow: none !important; }
.btn-main { background: var(--main-bg); color: var(--main-fg); box-shadow: 0 0.2rem 0 var(--main-ledge); }
.btn-sec { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--border-strong); }
.btn-known { background: var(--success); color: #fff; box-shadow: 0 0.2rem 0 #105030; }
.btn-review { background: var(--accent); color: var(--ink); box-shadow: 0 0.2rem 0 var(--accent-deep); }
.btn-danger { background: var(--danger); color: #fff; box-shadow: 0 0.2rem 0 #7f2219; }
.btn-ghost { background: transparent; color: var(--primary); padding: 0 0.5rem; min-height: 2.25rem; }
.btn-sm { min-height: 2.25rem; padding: 0 0.8rem; font-size: 0.875rem; border-radius: 0.7rem; }
.btn-block { width: 100%; }
.row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }

.pill { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.15rem 0.55rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
.p-pri { background: var(--accent-soft); color: var(--warning); }
.p-due { background: var(--primary-soft); color: var(--primary); }
.p-new { background: var(--neutral-soft); color: var(--muted); }
.p-ok { background: var(--success-soft); color: var(--success); }
.p-old { background: var(--danger-soft); color: var(--danger); }

.panel { background: var(--surface); border-radius: 1.1rem; padding: 1rem; box-shadow: var(--panel-ledge); border: 1px solid var(--border); }
.s-energy .panel { border-color: transparent; }
.group { display: block; width: 100%; text-align: left; margin: 0 0 0.75rem; cursor: pointer; }
.group h3 { margin: 0 0 0.45rem; font-size: 1.0625rem; font-weight: 600; }
.group .meta { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.notice { margin-top: 0.6rem; font-size: 0.8125rem; color: var(--danger); }
.hint { font-size: 0.8125rem; color: var(--muted); }
.section-title { margin: 1.25rem 0 0.5rem; font-size: 0.8125rem; font-weight: 600; color: var(--muted); }

.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 0; border-bottom: 1px solid var(--border); }
.list .w { font-weight: 600; }
.list .m { color: var(--muted); font-size: 0.875rem; }
.list .grow { flex: 1; min-width: 0; }

/* Flashcard */
.progress { display: flex; gap: 0.3rem; margin-bottom: 1rem; }
.progress span { flex: 1; height: 0.4rem; border-radius: 1rem; background: var(--primary-soft); }
.progress span.done { background: var(--success); }
.progress span.cur { background: var(--primary); }
.fc { position: relative; min-height: 20rem; padding: 1.4rem 1.3rem 1.6rem; background: var(--surface); border-radius: 1.5rem; box-shadow: var(--card-ledge); border: 1px solid var(--border); transform: rotate(var(--card-rot)); cursor: pointer; }
.s-energy .fc { border: 0; }
.fc .top { display: flex; justify-content: space-between; align-items: center; font-size: 0.8125rem; color: var(--muted); }
.fc .word { margin: 2.5rem 0 0.25rem; font-size: 2.4rem; font-weight: var(--h-weight); letter-spacing: -0.02em; text-align: center; }
.fc .pos { text-align: center; color: var(--muted); }
.fc .tap { position: absolute; left: 0; right: 0; bottom: 1rem; text-align: center; font-size: 0.8125rem; color: var(--placeholder); }
.fc .back { animation: flip-in var(--d-slow) var(--ease-enter); }
@keyframes flip-in { from { opacity: 0; transform: translateY(0.5rem); } }
.fc .meaning { margin: 0.9rem 0 0.2rem; font-size: 1.5rem; font-weight: 600; }
.fc .forms { font-size: 0.875rem; color: var(--muted); }
.fc .ex { margin-top: 0.9rem; padding: 0.6rem 0.8rem; background: var(--canvas); border-radius: 0.75rem; font-size: 0.9375rem; }
.fc .ctx { margin-top: 0.5rem; padding: 0.6rem 0.8rem; background: var(--accent-soft); border-radius: 0.75rem; font-size: 0.9375rem; }
.fc .ctx b, .fc .ex b { color: var(--primary); }
.answer { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 1.6rem; }
.answer .btn { min-height: 3.4rem; font-size: 0.9375rem; line-height: 1.2; padding: 0.4rem 0.6rem; text-align: center; }

/* Word page */
.wp-word { margin: 0; font-size: 2.1rem; font-weight: var(--h-weight); letter-spacing: -0.02em; }
.forms-line { margin-top: 0.15rem; font-size: 0.9375rem; color: var(--muted); }
.forms-line a, .link { color: var(--primary); font-weight: 600; text-decoration: underline; text-underline-offset: 0.2em; cursor: pointer; }
.pos-block { margin-top: 1.1rem; }
.pos-head { display: flex; gap: 0.5rem; align-items: baseline; font-size: 0.875rem; color: var(--muted); border-bottom: 2px solid var(--primary-soft); padding-bottom: 0.3rem; }
.pos-head b { color: var(--ink); font-size: 1rem; }
.sense { display: flex; gap: 0.75rem; align-items: flex-start; padding: 0.7rem 0; border-bottom: 1px solid var(--border); }
.sense .txt { flex: 1; }
.sense .ex { font-size: 0.875rem; color: var(--muted); margin-top: 0.15rem; }
.learning { margin-top: 0.4rem; font-size: 0.8125rem; color: var(--success); }

/* Inputs */
.field { display: block; margin-top: 0.8rem; }
.field span { display: block; font-size: 0.8125rem; color: var(--muted); margin-bottom: 0.3rem; }
.input { width: 100%; min-height: 2.9rem; padding: 0 0.9rem; border-radius: 0.8rem; border: 1.5px solid var(--border-strong); background: var(--surface); }
.input::placeholder { color: var(--placeholder); }
.search { display: flex; gap: 0.5rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
.chip { border: 1.5px solid var(--border-strong); background: var(--surface); border-radius: 999px; padding: 0.3rem 0.75rem; font-size: 0.8125rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

/* Bottom sheet */
.scrim { position: absolute; inset: 0; background: rgb(15 26 61 / 0.45); display: flex; align-items: flex-end; z-index: 10; animation: fade var(--d-base) var(--ease-standard); }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 1.5rem 1.5rem 0 0; padding: 1.1rem 1.1rem 1.5rem; animation: up var(--d-base) var(--ease-enter); }
@keyframes up { from { transform: translateY(2rem); opacity: 0; } }
.sheet h2 { margin: 0; font-size: 1.15rem; font-weight: var(--h-weight); }
@container (min-width: 760px) { .scrim { align-items: center; justify-content: center; } .sheet { width: 30rem; border-radius: 1.5rem; } }
.toast { position: absolute; left: 50%; bottom: 5.5rem; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 0.6rem 1rem; border-radius: 0.8rem; font-size: 0.875rem; z-index: 20; animation: up var(--d-slow) var(--ease-spring); white-space: nowrap; }

.switch { position: relative; width: 2.9rem; height: 1.7rem; border-radius: 1rem; border: 0; background: var(--border-strong); cursor: pointer; flex: none; }
.switch::after { content: ''; position: absolute; top: 0.2rem; left: 0.2rem; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: #fff; transition: transform var(--d-fast) var(--ease-standard); }
.switch[aria-checked="true"] { background: var(--success); }
.switch[aria-checked="true"]::after { transform: translateX(1.2rem); }
.seg { display: inline-flex; background: var(--canvas); border-radius: 0.8rem; padding: 0.2rem; }
.seg button { border: 0; background: transparent; padding: 0.45rem 0.9rem; border-radius: 0.65rem; cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 0 var(--border); font-weight: 600; }
.check { width: 1.2rem; height: 1.2rem; accent-color: var(--primary); }
.done-big { font-size: 2rem; font-weight: var(--h-weight); margin: 1.5rem 0 0.25rem; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 1rem; }
.stat { border-radius: 1rem; padding: 0.8rem; }
.stat b { display: block; font-size: 1.6rem; }
.note-box { margin: 1rem auto 0; max-width: 60rem; padding: 0 1rem; color: #3a4467; font-size: 0.875rem; }
</style>
</head>
<body>
<div class="toolbar" role="toolbar" aria-label="Điều khiển mockup">
  <div class="grp"><span class="lbl">Style:</span>
    <button data-style="s-energy" aria-pressed="true">1. Năng lượng (giống landing)</button>
    <button data-style="s-calm" aria-pressed="false">2. Tập trung (nền trắng)</button>
  </div>
  <div class="grp"><span class="lbl">Khung:</span>
    <button data-frame="phone" aria-pressed="true">Điện thoại 390</button>
    <button data-frame="wide" aria-pressed="false">Màn rộng</button>
  </div>
  <div class="grp"><span class="lbl">Màn:</span>
    <button data-jump="onboard">Chọn ngôn ngữ</button>
    <button data-jump="home">Nhóm</button>
    <button data-jump="group">Trang nhóm</button>
    <button data-jump="session">Phiên ôn</button>
    <button data-jump="backlog">Cân nhắc</button>
    <button data-jump="search">Tra từ</button>
    <button data-jump="word-left">Trang từ</button>
    <button data-jump="quick">Thêm nhanh</button>
    <button data-jump="settings">Cài đặt</button>
  </div>
</div>
<div class="stage"><div id="frame" class="frame s-energy" aria-live="polite"></div></div>
<p class="note-box">Mockup tĩnh để chốt style, dữ liệu là ví dụ. Màu lấy từ <code>packages/design-tokens/theme.css</code> (hướng B). Nút trong khung đều bấm được.</p>
<script>
const S = { screen: 'home', group: 'cn', card: 0, flipped: false, results: { known: 0, review: 0 }, sheet: null, toast: '', word: 'left',
  remind: true, lang: 'vi', filters: ['A2', 'Ẩm thực'], q: '', picked: new Set(['b1', 'b2']) };
const GROUPS = [
  { id: 'cn', name: 'Công nghệ', pri: 2, due: 5, neu: 3, old: 0 },
  { id: 'ielts', name: 'IELTS', pri: 0, due: 12, neu: 0, old: 40 },
  { id: 'new', name: 'Mới thêm', pri: 0, due: 0, neu: 3, old: 0, isDefault: true },
  { id: 'food', name: 'Ẩm thực A2', pri: 0, due: 0, neu: 0, old: 0, doneToday: true },
];
const GROUP_WORDS = [
  { w: 'deploy', m: 'triển khai', lv: 1, tag: 'pri', when: 'hôm nay' },
  { w: 'negotiate', m: 'đàm phán', lv: 2, tag: 'due', when: 'hôm nay' },
  { w: 'bandwidth', m: 'băng thông', lv: 3, tag: 'due', when: 'quá hạn 2 ngày' },
  { w: 'revenue', m: 'doanh thu', lv: 0, tag: 'new', when: 'mới' },
  { w: 'budget', m: 'ngân sách', lv: 4, tag: 'ok', when: 'hẹn 22/11' },
  { w: 'leaves', m: 'số nhiều của leaf', lv: 2, tag: 'ok', when: 'hẹn 19/11' },
];
const CARDS = [
  { w: 'deploy', pos: 'verb', lv: 'B2', tag: 'Ưu tiên', m: 'triển khai', forms: 'deploys · deploying · deployed', ex: 'They <b>deploy</b> updates every week.', ctx: 'We <b>deploy</b> the app every Friday.' },
  { w: 'negotiate', pos: 'verb', lv: 'B1', tag: 'Đến hạn', m: 'đàm phán, thương lượng', forms: 'negotiates · negotiating · negotiated', ex: 'We need to <b>negotiate</b> a better price.' },
  { w: 'went', pos: 'verb', lv: 'A1 · theo go', tag: 'Đến hạn', m: 'quá khứ của <a class="link" data-word="go">go</a>', ex: 'She <b>went</b> home early.', ctx: 'I <b>went</b> to the bank yesterday.' },
  { w: 'revenue', pos: 'noun', lv: 'B2', tag: 'Mới', m: 'doanh thu', forms: 'revenues', ex: 'Our <b>revenue</b> grew by 20%.' },
];
const BACKLOG = [
  { id: 'b1', w: 'abolish', m: 'bãi bỏ', last: 'hẹn 03/08, quá hạn 74 ngày' },
  { id: 'b2', w: 'curriculum', m: 'chương trình học', last: 'hẹn 10/08, quá hạn 67 ngày' },
  { id: 'b3', w: 'scholarship', m: 'học bổng', last: 'hẹn 12/08, quá hạn 65 ngày' },
  { id: 'b4', w: 'thesis', m: 'luận văn', last: 'hẹn 14/08, quá hạn 63 ngày' },
];
const WORDS = {
  left: { forms: null, blocks: [
    { pos: 'adjective', lv: 'A1', senses: [{ m: 'bên trái', ex: 'Raise your left hand.' }] },
    { pos: 'adverb', lv: 'A2', senses: [{ m: 'về phía bên trái', ex: 'Turn left at the corner.', learning: 'Đang học · nhóm IELTS · mức 2 · hẹn 19/11' }] },
    { pos: 'noun', lv: 'A2', senses: [{ m: 'phía bên trái', ex: 'Keep to the left.' }] },
    { pos: 'verb', lv: 'A1 · theo leave', senses: [{ m: 'quá khứ và phân từ của ', ref: 'leave', ex: 'She left an hour ago.' }] } ] },
  leave: { forms: ['leaves', 'leaving', 'left', 'left'], blocks: [
    { pos: 'verb', lv: 'A1', senses: [{ m: 'rời đi', ex: 'I leave work at six.' }, { m: 'để lại', ex: 'Leave your bag here.' }] },
    { pos: 'noun', lv: 'B1', senses: [{ m: 'kỳ nghỉ phép', ex: 'She is on maternity leave.' }] } ] },
  go: { forms: ['goes', 'going', 'went', 'gone'], blocks: [
    { pos: 'verb', lv: 'A1', senses: [{ m: 'đi', ex: 'Let’s go home.', learning: 'Đang học · nhóm Mới thêm · mức 0 (mới)' }, { m: 'trở nên', ex: 'The milk went sour.' }] } ] },
  deploy: { forms: ['deploys', 'deploying', 'deployed', 'deployed'], blocks: [
    { pos: 'verb', lv: 'B2', senses: [{ m: 'triển khai (phần mềm, lực lượng)', ex: 'We deploy the app every Friday.' }] } ] },
  went: { forms: null, blocks: [
    { pos: 'verb', lv: 'A1 · theo go', senses: [{ m: 'quá khứ của ', ref: 'go', ex: 'She went home early.' }] } ] },
};
const RESULTS = [
  { w: 'bread', pos: 'noun', m: 'bánh mì' }, { w: 'cook', pos: 'verb', m: 'nấu ăn' },
  { w: 'delicious', pos: 'adjective', m: 'ngon' }, { w: 'menu', pos: 'noun', m: 'thực đơn' }, { w: 'recipe', pos: 'noun', m: 'công thức nấu ăn' },
];
const TABS = [['home', '▦', 'Nhóm'], ['search', '⌕', 'Tra từ'], ['quick', '＋', 'Thêm nhanh'], ['settings', '⚙', 'Cài đặt']];

const $frame = document.getElementById('frame');
const esc = (s) => s;
function tagPill(t) { return t === 'pri' ? '<span class="pill p-pri">Ưu tiên</span>' : t === 'due' ? '<span class="pill p-due">Đến hạn</span>' : t === 'new' ? '<span class="pill p-new">Mới</span>' : '<span class="pill p-ok">Chưa tới hạn</span>'; }
function appbar(title, sub, back) {
  return `<header class="appbar">${back ? `<button class="back" data-go="${back}" aria-label="Quay lại">←</button>` : '<span class="logo-mark" aria-hidden="true">_ _</span>'}
    <div style="flex:1;min-width:0"><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div></header>`;
}
function tabbar(active) {
  return `<nav class="tabbar" aria-label="Điều hướng chính"><div class="side-logo"><span class="logo-mark">_ _</span> Wordmet</div>${TABS.map(([id, ic, label]) =>
    `<button class="tab${id === 'quick' ? ' add' : ''}" data-go="${id}" ${active === id ? 'aria-current="page"' : ''}><span class="ic" aria-hidden="true">${ic}</span>${label}</button>`).join('')}</nav>`;
}
function shell(active, inner, title, sub, back) {
  return `<div class="frame-inner">${tabbar(active)}<div class="app">${appbar(title, sub, back)}<main class="content">${inner}</main></div></div>`;
}

const SCREENS = {
  onboard() {
    return `<div class="app"><header class="appbar"><span class="logo-mark">_ _</span><div style="flex:1"><h1>Chào mừng bạn</h1><div class="sub">Bước 1/1 · chỉ hỏi một lần</div></div></header>
    <main class="content"><p style="margin:0.5rem 0 0;font-size:1.25rem;font-weight:600">Bạn muốn xem nghĩa bằng ngôn ngữ nào?</p>
    <p class="hint">Đây cũng là ngôn ngữ của giao diện. Đổi lại được trong Cài đặt.</p>
    <div style="display:grid;gap:0.6rem;margin-top:1rem">
      <button class="panel btn-sec" style="text-align:left;padding:1rem;cursor:pointer" data-go="home"><b>Tiếng Việt</b><div class="hint">Nghĩa tiếng Việt, giao diện tiếng Việt</div></button>
      <button class="panel btn-sec" style="text-align:left;padding:1rem;cursor:pointer" data-go="home"><b>English</b><div class="hint">English definitions and interface</div></button>
    </div>
    <p class="hint" style="margin-top:1.25rem">Múi giờ lấy tự động theo thiết bị: <b>Asia/Ho_Chi_Minh</b>. Không cần chọn.</p></main></div>`;
  },
  home() {
    const cards = GROUPS.map((g) => `<button class="panel group" data-group="${g.id}">
      <h3>${g.name}${g.isDefault ? ' <span class="hint">· mặc định</span>' : ''}</h3>
      <div class="meta">${g.pri ? `<span class="pill p-pri">${g.pri} ưu tiên</span>` : ''}${g.due ? `<span class="pill p-due">${g.due} đến hạn</span>` : ''}${g.neu ? `<span class="pill p-new">${g.neu} mới</span>` : ''}${g.doneToday ? '<span class="pill p-ok">Xong hôm nay</span>' : ''}</div>
      ${g.old ? `<div class="notice">${g.old} từ lâu chưa ôn. Xem và chọn</div>` : ''}</button>`).join('');
    return shell('home', `<div class="row" style="justify-content:space-between;margin-bottom:0.75rem"><span class="hint">Nhóm có từ cần ôn xếp lên trước</span><button class="btn btn-sec btn-sm" data-toast="Đã tạo nhóm mới (mockup)">+ Tạo nhóm</button></div><div class="cols">${cards}</div>`, 'Nhóm của bạn', 'Thứ Sáu, 16/10');
  },
  group() {
    const rows = GROUP_WORDS.map((x) => `<li><div class="grow"><div class="w">${x.w}</div><div class="m">${x.m}</div></div>
      <div style="text-align:right">${tagPill(x.tag)}<div class="hint">mức ${x.lv} · ${x.when}</div></div></li>`).join('');
    return shell('home', `<div class="panel"><div class="meta" style="display:flex;gap:0.35rem;flex-wrap:wrap"><span class="pill p-pri">2 ưu tiên</span><span class="pill p-due">5 đến hạn</span><span class="pill p-new">3 mới</span></div>
      <p class="hint" style="margin:0.6rem 0 0.9rem">Hôm nay còn tối đa 20 từ mới và 100 từ ôn. Từ ưu tiên không tính vào trần.</p>
      <button class="btn btn-main btn-block" data-start="1">Ôn ngay (10 từ)</button>
      <div class="row" style="margin-top:0.6rem"><button class="btn btn-sec btn-sm" data-start="1">Học tất cả</button><button class="btn btn-ghost btn-sm" data-toast="Đổi tên (mockup)">Đổi tên</button><button class="btn btn-ghost btn-sm" style="color:var(--danger)" data-sheet="delete">Xóa nhóm</button></div></div>
      <div class="section-title">Từ trong nhóm (18)</div><ul class="list">${rows}</ul>`, 'Công nghệ', '18 từ', 'home');
  },
  session() {
    const c = CARDS[S.card];
    const prog = CARDS.map((_, i) => `<span class="${i < S.card ? 'done' : i === S.card ? 'cur' : ''}"></span>`).join('');
    const front = `<div class="top"><span class="pill ${c.tag === 'Ưu tiên' ? 'p-pri' : c.tag === 'Mới' ? 'p-new' : 'p-due'}">${c.tag}</span><span>${c.lv}</span></div>
      <div class="word">${c.w}</div><div class="pos">${c.pos}</div>`;
    const back = `<div class="back"><div class="meaning">${c.m}</div>${c.forms ? `<div class="forms">${c.forms}</div>` : ''}
      <div class="ex">${c.ex}</div>${c.ctx ? `<div class="ctx"><span class="hint">Câu bạn đã gặp</span><br>${c.ctx}</div>` : ''}</div>`;
    return shell('home', `<div class="progress" aria-label="Thẻ ${S.card + 1}/${CARDS.length}">${prog}</div>
      <div class="fc" data-flip="1" role="button" tabindex="0" aria-label="Lật thẻ">${S.flipped ? `<div class="top"><span class="pill p-due">${c.pos}</span><span>${c.lv}</span></div><div class="word" style="margin-top:0.6rem;font-size:1.9rem">${c.w}</div>${back}` : front + '<div class="tap">Chạm để lật</div>'}</div>
      ${S.flipped ? `<div class="answer"><button class="btn btn-review" data-answer="review">Cần ôn tập,<br>đưa vào ưu tiên</button><button class="btn btn-known" data-answer="known">Đã biết</button></div>`
        : `<p class="hint" style="text-align:center;margin-top:1.75rem">Thử nhớ nghĩa trước, rồi chạm vào thẻ.</p>`}`,
      'Công nghệ', `Thẻ ${S.card + 1}/${CARDS.length}`, 'group');
  },
  sessionDone() {
    return shell('home', `<div style="text-align:center"><div class="done-big">Xong phiên ôn</div><p class="hint">Nhóm Công nghệ · ${CARDS.length} thẻ</p></div>
      <div class="stats"><div class="stat" style="background:var(--success-soft);color:var(--success)"><b>${S.results.known}</b>Đã biết</div><div class="stat" style="background:var(--accent-soft);color:var(--warning)"><b>${S.results.review}</b>Cần ôn tập</div></div>
      <p class="hint" style="margin-top:1rem">Từ "Cần ôn tập" về mức 1 và nằm đầu danh sách. Ngày mai nhóm này có 4 từ đến hạn.</p>
      <div style="display:grid;gap:0.6rem;margin-top:1.25rem"><button class="btn btn-main" data-go="home">Về danh sách nhóm</button><button class="btn btn-sec" data-start="1">Ôn lại từ ưu tiên</button></div>`, 'Công nghệ', 'Kết thúc phiên', 'group');
  },
  backlog() {
    const rows = BACKLOG.map((x) => `<li><input type="checkbox" class="check" data-pick="${x.id}" ${S.picked.has(x.id) ? 'checked' : ''} aria-label="Chọn ${x.w}"><div class="grow"><div class="w">${x.w}</div><div class="m">${x.m} · ${x.last}</div></div></li>`).join('');
    return shell('home', `<div class="panel" style="background:var(--danger-soft);border:0"><b>40 từ lâu chưa ôn</b><p class="hint" style="margin:0.25rem 0 0;color:var(--ink)">Những từ quá hạn hơn 60 ngày tạm rời khỏi danh sách cần ôn. Bạn chọn: học lại (về mức 0, mỗi ngày tối đa 20 từ), bỏ khỏi việc học, hoặc cứ để đó.</p></div>
      <div class="row" style="justify-content:space-between;margin-top:0.9rem"><span class="hint">Đã chọn ${S.picked.size}</span><button class="btn btn-ghost btn-sm" data-pickall="1">Chọn tất cả</button></div>
      <ul class="list">${rows}</ul>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin-top:1rem"><button class="btn btn-main" data-toast="Đã đưa ${S.picked.size} từ về mức 0">Học lại</button><button class="btn btn-sec" style="color:var(--danger)" data-toast="Đã bỏ ${S.picked.size} từ khỏi việc học">Bỏ khỏi việc học</button></div>`, 'Lâu chưa ôn', 'Nhóm IELTS', 'home');
  },
  search() {
    const f = ['A1', 'A2', 'B1', 'Ẩm thực', 'Công nghệ', 'noun', 'verb', 'Từ của tôi'];
    const rows = RESULTS.map((r) => `<li><div class="grow"><div class="w">${r.w} <span class="hint">${r.pos}</span></div><div class="m">${r.m}</div></div><button class="btn btn-ghost btn-sm" data-word="left">Xem</button></li>`).join('');
    return shell('search', `<div class="search"><input class="input" placeholder="Tìm từ, ví dụ left" value="${S.q}" data-q="1" aria-label="Tìm từ"><button class="btn btn-main" data-word="left">Tìm</button></div>
      <div class="chips">${f.map((x) => `<button class="chip" data-filter="${x}" aria-pressed="${S.filters.includes(x)}">${x}</button>`).join('')}</div>
      <div class="row" style="justify-content:space-between;margin-top:1rem"><span class="hint">40 từ · đã bỏ qua 3 từ chức năng</span><button class="btn btn-sec btn-sm" data-sheet="bulk">Thêm cả 40 từ vào nhóm…</button></div>
      <ul class="list" style="margin-top:0.4rem">${rows}</ul><p class="hint">… 35 từ nữa</p>`, 'Tra từ', 'Tìm hoặc lọc theo level, chủ đề');
  },
  word() {
    const d = WORDS[S.word] || WORDS.left;
    const forms = d.forms ? `<div class="forms-line">${d.forms.map((f) => WORDS[f] ? `<a data-word="${f}">${f}</a>` : f).join(' · ')}</div>` : '';
    const blocks = d.blocks.map((b) => `<div class="pos-block"><div class="pos-head"><b>${b.pos}</b><span>${b.lv}</span></div>${b.senses.map((s) => `<div class="sense"><div class="txt"><div>${s.m}${s.ref ? `<a class="link" data-word="${s.ref}">${s.ref}</a>` : ''}</div><div class="ex">${s.ex}</div>${s.learning ? `<div class="learning">✓ ${s.learning} · <a class="link" data-sheet="ctx">Thêm câu đã gặp</a></div>` : ''}</div>
      ${s.learning ? '' : `<button class="btn btn-sec btn-sm" data-sheet="addto">+ Thêm</button>`}</div>`).join('')}</div>`).join('');
    return shell('search', `<h2 class="wp-word">${S.word}</h2>${forms}${blocks}`, 'Trang từ', '', 'search');
  },
  quick() { S.sheet = S.sheet || 'quick'; return SCREENS.home().replace('aria-current="page"', '').replace('data-go="quick"', 'data-go="quick" aria-current="page"'); },
  settings() {
    return shell('settings', `<div class="panel"><div class="row" style="justify-content:space-between"><div><b>Ngôn ngữ</b><div class="hint">Nghĩa và giao diện</div></div>
      <div class="seg"><button aria-pressed="${S.lang === 'vi'}" data-lang="vi">Tiếng Việt</button><button aria-pressed="${S.lang === 'en'}" data-lang="en">English</button></div></div></div>
      <div class="panel" style="margin-top:0.75rem"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div><b>Nhắc học qua email</b><div class="hint">"Tới giờ học từ vựng" lúc 20:00 theo giờ của bạn, chỉ khi có từ cần ôn</div></div>
      <button class="switch" role="switch" aria-checked="${S.remind}" data-remind="1" aria-label="Nhắc học qua email"></button></div></div>
      <div class="panel" style="margin-top:0.75rem"><b>Múi giờ</b><div class="hint">Asia/Ho_Chi_Minh · tự cập nhật theo thiết bị</div></div>
      <div class="panel" style="margin-top:0.75rem"><b>Tài khoản</b><div class="hint">lan@example.com</div><button class="btn btn-ghost btn-sm" style="padding:0;margin-top:0.3rem">Đăng xuất</button></div>`, 'Cài đặt', '');
  },
};

const SHEETS = {
  quick() {
    return `<h2>Thêm nhanh</h2><p class="hint" style="margin:0.2rem 0 0">Từ bạn vừa gặp, kèm câu (nếu có)</p>
      <label class="field"><span>Từ</span><input class="input" value="went" aria-label="Từ"></label>
      <label class="field"><span>Câu bạn đã gặp (tùy chọn, tối đa 300 ký tự)</span><input class="input" value="I went to the bank yesterday." aria-label="Câu đã gặp"></label>
      <div class="panel" style="margin-top:0.9rem;background:var(--primary-soft);border:0"><b>went</b> · verb · quá khứ của <a class="link" data-word="go">go</a>
        <div class="hint" style="margin-top:0.2rem">Catalog có trang riêng cho "went".</div>
        <div class="row" style="margin-top:0.6rem"><button class="btn btn-main btn-sm" data-sheet="addto">Thêm "went"</button><button class="btn btn-sec btn-sm" data-word="go">Mở "go"</button></div></div>
      <p class="hint" style="margin-top:0.8rem">Không đúng nghĩa bạn gặp? <a class="link" data-sheet="manual">Tự nhập nghĩa</a></p>`;
  },
  manual() {
    return `<h2>Tự nhập từ riêng</h2><p class="hint" style="margin:0.2rem 0 0">Chỉ bạn thấy từ này</p>
      <label class="field"><span>Từ</span><input class="input" value="deployed"></label>
      <div class="hint" style="margin-top:0.35rem">App nhận ra: quá khứ của <a class="link" data-word="deploy">deploy</a> (đã gắn sẵn)</div>
      <label class="field"><span>Nghĩa (bắt buộc)</span><input class="input" placeholder="đã triển khai"></label>
      <label class="field"><span>Loại từ, level, chủ đề (tùy chọn)</span><input class="input" placeholder="verb"></label>
      <label class="field"><span>Nhóm</span><select class="input"><option>Mới thêm</option><option>Công nghệ</option><option>IELTS</option></select></label>
      <button class="btn btn-main btn-block" style="margin-top:1rem" data-toast="Đã lưu từ riêng vào nhóm Mới thêm">Lưu</button>`;
  },
  addto() {
    return `<h2>Thêm vào nhóm</h2><p class="hint" style="margin:0.2rem 0 0">Từ vào ở mức 0 (mới)</p>
      <label class="field"><span>Nhóm</span><select class="input"><option>Mới thêm</option><option>Công nghệ</option><option>IELTS</option><option>+ Tạo nhóm mới…</option></select></label>
      <button class="btn btn-main btn-block" style="margin-top:1rem" data-toast="Đã thêm vào nhóm Mới thêm">Thêm</button>`;
  },
  ctx() {
    return `<h2>Thêm câu đã gặp</h2><p class="hint" style="margin:0.2rem 0 0">Tối đa 5 câu cho mỗi nghĩa · đang có 1</p>
      <label class="field"><span>Câu</span><input class="input" placeholder="Turn left after the bridge."></label>
      <button class="btn btn-main btn-block" style="margin-top:1rem" data-toast="Đã lưu câu">Lưu câu</button>`;
  },
  bulk() {
    return `<h2>Thêm cả loạt</h2><p class="hint" style="margin:0.2rem 0 0">40 từ A2 · Ẩm thực. Bỏ qua 3 từ chức năng (in, the, of). 2 từ đã có trong việc học sẽ không tạo trùng.</p>
      <label class="field"><span>Vào nhóm</span><select class="input"><option>+ Nhóm mới "Ẩm thực A2"</option><option>Mới thêm</option></select></label>
      <p class="hint">Cả 40 từ vào ở mức 0; nhóm đưa ra tối đa 20 từ mới mỗi ngày.</p>
      <button class="btn btn-main btn-block" style="margin-top:0.6rem" data-toast="Đã thêm 38 từ vào Ẩm thực A2">Thêm 38 từ</button>`;
  },
  delete() {
    return `<h2>Xóa nhóm "Công nghệ"?</h2>
      <div class="panel" style="margin-top:0.8rem;background:var(--danger-soft);border:0"><b>12 từ chỉ có trong nhóm này</b> sẽ bị <b>bỏ khỏi việc ôn tập</b> (mất mức và ngày hẹn).<br><span class="hint" style="color:var(--ink)">6 từ còn nằm ở nhóm khác vẫn giữ nguyên.</span></div>
      <div style="display:grid;gap:0.6rem;margin-top:1rem"><button class="btn btn-danger" data-toast="Đã xóa nhóm và 12 từ" data-go="home">Xóa nhóm và 12 từ</button><button class="btn btn-sec" data-close="1">Giữ lại</button></div>`;
  },
};

function render() {
  const key = S.screen === 'word' ? 'word' : S.screen;
  let html = (SCREENS[key] || SCREENS.home)();
  if (S.sheet) html += `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${SHEETS[S.sheet]()}<button class="btn btn-ghost btn-sm" style="margin-top:0.6rem" data-close="1">Đóng</button></div></div>`;
  if (S.toast) html += `<div class="toast" role="status">${S.toast}</div>`;
  $frame.innerHTML = html;
}
function go(screen) { S.sheet = null; if (screen === 'quick') { S.sheet = 'quick'; S.screen = S.screen === 'quick' ? 'home' : S.screen; } else { S.screen = screen; } if (screen === 'session') { S.card = 0; S.flipped = false; S.results = { known: 0, review: 0 }; } render(); }
function toast(t) { S.toast = t; render(); setTimeout(() => { S.toast = ''; render(); }, 1800); }

$frame.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-group],[data-start],[data-flip],[data-answer],[data-word],[data-sheet],[data-close],[data-toast],[data-filter],[data-remind],[data-lang],[data-pick],[data-pickall]');
  if (e.target.classList.contains('scrim')) { S.sheet = null; render(); return; }
  if (!t) return;
  if (t.dataset.pick) { S.picked.has(t.dataset.pick) ? S.picked.delete(t.dataset.pick) : S.picked.add(t.dataset.pick); render(); return; }
  if (t.dataset.pickall) { BACKLOG.forEach((x) => S.picked.add(x.id)); render(); return; }
  if (t.dataset.toast) { S.sheet = null; if (t.dataset.go) S.screen = t.dataset.go; toast(t.dataset.toast); return; }
  if (t.dataset.close !== undefined && (t.dataset.close || e.target === t)) { S.sheet = null; render(); return; }
  if (t.dataset.group) { S.screen = t.dataset.group === 'ielts' ? 'backlog' : 'group'; render(); return; }
  if (t.dataset.start) { go('session'); return; }
  if (t.dataset.flip) { if (!S.flipped) { S.flipped = true; render(); } return; }
  if (t.dataset.answer) { S.results[t.dataset.answer]++; S.card++; S.flipped = false; if (S.card >= CARDS.length) { S.screen = 'sessionDone'; } render(); return; }
  if (t.dataset.word) { e.preventDefault(); S.sheet = null; S.word = WORDS[t.dataset.word] ? t.dataset.word : 'left'; S.screen = 'word'; render(); return; }
  if (t.dataset.sheet) { S.sheet = t.dataset.sheet; render(); return; }
  if (t.dataset.filter) { const f = t.dataset.filter; S.filters = S.filters.includes(f) ? S.filters.filter((x) => x !== f) : [...S.filters, f]; render(); return; }
  if (t.dataset.remind) { S.remind = !S.remind; render(); return; }
  if (t.dataset.lang) { S.lang = t.dataset.lang; render(); return; }
  if (t.dataset.go) { go(t.dataset.go); }
});
$frame.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.flip && !S.flipped) { S.flipped = true; render(); } });

document.querySelector('.toolbar').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.style) { $frame.classList.remove('s-energy', 's-calm'); $frame.classList.add(b.dataset.style);
    document.querySelectorAll('[data-style]').forEach((x) => x.setAttribute('aria-pressed', x === b)); }
  if (b.dataset.frame) { $frame.classList.toggle('wide', b.dataset.frame === 'wide');
    document.querySelectorAll('[data-frame]').forEach((x) => x.setAttribute('aria-pressed', x === b)); }
  if (b.dataset.jump) { const j = b.dataset.jump; if (j === 'word-left') { S.word = 'left'; S.sheet = null; S.screen = 'word'; render(); } else if (j === 'quick') { S.screen = 'home'; S.sheet = 'quick'; render(); } else go(j); }
});
render();
</script>
</body>
</html>
