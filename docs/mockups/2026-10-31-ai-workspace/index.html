<body>
<div class="mockbar"><b>Bản xem trước · dữ liệu minh họa</b><span>Thao tác tại đây không thay đổi app hay gọi AI.</span><button onclick="showNotes()">Ghi chú thiết kế & API</button></div>
<div class="shell"><aside class="sidebar"><div class="brand"><span class="mark">w</span>wordmet<span class="muted small" style="font-weight:400;letter-spacing:0">admin</span></div><nav id="sidenav"></nav><div class="profile row"><div class="avatar">TN</div><div><strong class="small">Tiến Ngô</strong><span class="secondary">Quản trị viên</span></div></div></aside>
<main class="workspace"><div class="topline"><span>Wordmet / AI / <span id="crumb">Cấu hình</span></span><span>Tiếng Việt · Giao diện sáng</span></div><div id="mobilenav" class="mobile-nav"></div><div class="sheet" id="app"></div></main></div>
<dialog id="modal" aria-labelledby="modaltitle"></dialog><div id="toast" role="status" aria-live="polite" hidden class="toast"></div>
<script>
const icons={grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',sliders:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="white"/><circle cx="15" cy="12" r="2" fill="white"/><circle cx="8" cy="18" r="2" fill="white"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M3 6h.01M3 12h.01M3 18h.01"/>',chart:'<path d="M4 3v17h17M8 16v-5M13 16V6M18 16V9"/>',plus:'<path d="M12 5v14M5 12h14"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',play:'<path d="m8 5 11 7-11 7Z"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>',arrow:'<path d="M19 12H5m6-6-6 6 6 6"/>',check:'<path d="m5 12 4 4L19 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.list}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ops={generate_cloze:'Điền từ vào câu',generate_sentence_mcq:'Trắc nghiệm theo câu',generate_meaning_question:'Chọn nghĩa trong câu',lookup_word:'Tra từ',check_private_word:'Kiểm tra từ riêng',translate_sentence:'Dịch câu'};
let page='configs',configTab='drafts',editing=null,historyTab='publish',op='generate_cloze',wordPage=1,sort='az',filterSplit='all',filterLevel='all',search='',selected=new Set(),toastTimer,quickPicked=new Set(),quickSearch='',quickLevel='all',lastOutput=false;
const promptDefault='You write one English practice sentence for a Vietnamese learner.\n\nUse the target word with the meaning provided. Write exactly one blank (___). Include enough context to make the target word the best answer.\n\nUse natural vocabulary and grammar appropriate for the supplied CEFR level. Return the accepted forms and a faithful Vietnamese translation.';
let drafts=[{id:18,name:'Terra · ngữ cảnh rõ hơn',model:'gpt-6.1-terra',effort:'low',note:'Thử giảm đáp án gần nghĩa',prompt:promptDefault,version:3,run:'Xong',count:100,shape:100,rule:96,expected:98,cost:'.0840'},{id:19,name:'Sol · cùng prompt để đối chiếu',model:'gpt-6.1-sol',effort:'medium',note:'Đối chiếu cùng bộ v4',prompt:promptDefault,version:1,run:'Đang chạy',count:100,progress:62,cost:'.1260'},{id:20,name:'Terra · ngắn và tự nhiên',model:'gpt-6.1-terra',effort:'minimal',note:'Thử cho trình độ A1–A2',prompt:promptDefault,version:1,run:'Chưa chạy',cost:null}];
let live={id:17,model:'claude-sonnet-5-5',name:'Sonnet · bản ổn định',date:'30/10/2026, 16:42',effort:'medium'};
const wordNames=['afford','alarm','annual','app','arrive','automate','bake','banana','boil','borrow','brand','breakfast','browser','busy','click','cloud','compete','contract','currency','database','debt','delicious','deploy','download','encrypt','estimate','ferment','friend','fry','game','garnish','happy','hire','hungry','import','increase','ingredient','install','interface','invest'];
const meanings=['đủ khả năng chi trả','chuông báo thức','hằng năm','ứng dụng','đến nơi','tự động hóa','nướng bằng lò','quả chuối','đun sôi','mượn','thương hiệu','bữa sáng','trình duyệt','bận rộn','nhấp chuột','điện toán đám mây','cạnh tranh','hợp đồng','tiền tệ','cơ sở dữ liệu'];
let words=wordNames.map((word,i)=>({id:i+1,word,pos:['verb','noun','adjective','noun'][i%4],level:['A1','A2','B1','B2'][i%4],meaning:meanings[i%20],split:i%10<3?'held_out':'dev'}));
let batches=[{id:'EV-028',kind:'Eval',draft:19,model:'gpt-6.1-sol',state:'Đang chạy',count:100,done:62,cost:'.1260',time:'Hôm nay, 14:35',input:83240,output:11600,retry:2},{id:'EV-027',kind:'Eval',draft:18,model:'gpt-6.1-terra',state:'Xong',count:100,done:100,cost:'.0840',time:'Hôm nay, 14:32',input:51200,output:6560,retry:3},{id:'JG-011',kind:'Judge',draft:18,model:'claude-haiku-5-5',state:'Xong',count:100,done:100,cost:'.0410',time:'Hôm nay, 14:30',input:42300,output:6740,retry:0},{id:'TS-032',kind:'Chạy thử',draft:20,model:'gpt-6.1-terra',state:'Xong',count:5,done:5,cost:'.0038',time:'Hôm nay, 14:27',input:2400,output:280,retry:0}];
function nav(){let items=[['configs','Cấu hình','sliders'],['examples','Bộ ví dụ','list'],['costs','Chi phí','chart']];document.getElementById('sidenav').innerHTML=`<button class="navitem" onclick="toast('Mockup chỉ tập trung các trang AI được yêu cầu')">${icon('grid')}<span>Tổng quan</span></button><div class="navlabel">NỘI DUNG</div><button class="navitem" onclick="toast('Ngoài phạm vi bản xem trước')">${icon('list')}<span>Từ & nghĩa</span></button><div class="navlabel">AI</div><button class="navitem" onclick="toast('Ngoài phạm vi bản xem trước')">${icon('chart')}<span>Tình trạng</span></button>${items.map(([key,name,ic])=>`<button class="navitem ${page===key?'active':''}" onclick="go('${key}')">${icon(ic)}<span>${name}</span></button>`).join('')}<button class="navitem" onclick="toast('Judge giữ ở trang riêng hiện có')">${icon('check')}<span>Judge</span></button><button class="navitem" onclick="toast('Ngoài phạm vi bản xem trước')">${icon('list')}<span>Câu AI thật</span></button><div class="navlabel">HỆ THỐNG</div><button class="navitem" onclick="toast('Ngoài phạm vi bản xem trước')">${icon('sliders')}<span>Cài đặt hệ thống</span></button>`;document.getElementById('mobilenav').innerHTML=items.map(([k,n])=>`<button class="btn sm ${page===k?'primary':''}" onclick="go('${k}')">${n}</button>`).join('');}
function go(p){page=p;nav();render();}
function render(){nav();document.getElementById('crumb').textContent={configs:'Cấu hình',examples:'Bộ ví dụ',costs:'Chi phí'}[page];document.getElementById('app').innerHTML=page==='configs'?configScreen():page==='examples'?examplesScreen():costScreen();if(page==='examples')setSelectionState();}
function opSelect(){return `<div class="opbar"><label for="operation">Thao tác</label><select class="control" id="operation" onchange="op=this.value;editing=null;render()">${Object.entries(ops).map(([k,v])=>`<option value="${k}" ${op===k?'selected':''}>${v} · ${k}</option>`).join('')}</select></div>`;}
function configScreen(){return `<div class="heading"><h1>Cấu hình AI</h1><p>Tạo nhiều hướng thử nghiệm, chạy đối chiếu rồi chọn bản để publish.</p></div>${opSelect()}<div class="config-layout"><div><nav class="tabs" aria-label="Trang cấu hình"><button class="tab ${configTab==='drafts'?'active':''}" onclick="configTab='drafts';editing=null;render()">Các bản nháp <span class="badge-count">${drafts.length}</span></button><button class="tab ${configTab==='history'?'active':''}" onclick="configTab='history';editing=null;render()">Lịch sử</button></nav>${configTab==='history'?historyScreen():editing!==null?editorScreen():draftList()}</div>${livePanel()}</div>`;}
function livePanel(){return `<aside class="live" aria-label="Bản đang chạy"><div class="live-head" onclick="this.parentElement.classList.toggle('expanded')"><div class="between"><span class="chip green"><span class="dot"></span>Đang chạy</span><span class="small muted">Cấu hình #${live.id}</span></div><div class="model">${esc(live.model)}</div><span class="small muted">${esc(live.name)}</span></div><div class="live-body"><dl><dt>Nhà cung cấp</dt><dd>${live.model.startsWith('gpt')?'OpenAI':'Anthropic'}</dd><dt>Effort</dt><dd>${live.effort}</dd><dt>Giới hạn output</dt><dd>1.200 token</dd><dt>Publish</dt><dd>${live.date}</dd></dl><details class="promptpeek"><summary>Xem prompt đang chạy</summary><pre>${esc(promptDefault)}</pre></details><div class="divider"><p class="small muted">Bản này phục vụ người học. Các lần chạy nháp và chạy tạm không thay đổi nó.</p></div><button class="btn ghost sm" onclick="toast('Demo: quay về cấu hình trước — cần xác nhận trong app thật')">Quay về cấu hình #16</button></div></aside>`;}
function status(s){return `<span class="chip ${s==='Xong'?'green':s==='Đang chạy'?'blue':s==='Chưa chạy'?'':'yellow'}">${s==='Đang chạy'?'<span class="dot"></span>':''}${s}</span>`;}
function draftList(){return `<div class="between" style="margin-bottom:18px"><div><h2>Các bản nháp</h2><p class="hint">Mỗi nháp có model, prompt và các lần chạy riêng.</p></div><button class="btn primary" onclick="createDraft()">${icon('plus')}Tạo nháp</button></div>${drafts.length?`<div class="tablewrap"><table><thead><tr><th>Bản nháp</th><th>Lần chạy gần nhất</th><th class="numeric">Chi phí</th><th aria-label="Hành động"></th></tr></thead><tbody>${drafts.map(d=>`<tr class="draft-row"><td><button class="titlelink" onclick="editDraft(${d.id})">${esc(d.name)}</button><span class="secondary">#${d.id} · ${esc(d.model)} · ${d.effort}</span><span class="secondary">Lưu lần ${d.version} · ${esc(d.note)}</span></td><td>${status(d.run)}${d.run==='Xong'?`<span class="secondary">Khuôn ${d.shape}/100 · Luật ${d.rule}/100</span>`:d.run==='Đang chạy'?`<span class="secondary">${d.progress}/${d.count} ví dụ · snapshot #${d.id}</span>`:'<span class="secondary">Chưa có kết quả eval</span>'}</td><td class="numeric">${d.cost?'$'+Number(d.cost).toFixed(4):'—'}</td><td>${draftMenu(d)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có nháp. Tạo nháp từ bản đang chạy để bắt đầu thử nghiệm.</div>'}<p class="legalnote">Hai nháp có thể chạy cùng lúc. Mở từng nháp để xem kết quả, chọn từ chạy thử hoặc publish.</p>`;}
function draftMenu(d){return `<details class="menu"><summary aria-label="Hành động nháp ${d.id}">${icon('more')}</summary><div class="items"><button onclick="editDraft(${d.id})">Sửa nháp</button><button onclick="editDraft(${d.id});openPicker()">Chạy thử với từ đã chọn</button><button onclick="editDraft(${d.id});startEval()">Chạy bộ ví dụ</button><button onclick="publishDialog(${d.id})">Publish…</button><button onclick="cloneDraft(${d.id})">Nhân bản</button><button class="danger-text" onclick="deleteDraft(${d.id})">Xóa nháp…</button></div></details>`;}
function editDraft(id){editing=id;configTab='drafts';render();}
function createDraft(){modal('Tạo bản nháp','Nháp mới được sao chép từ bản đang chạy.',`<label class="field">Tên nháp<input id="newname" class="control" placeholder="Ví dụ: Terra · prompt ngắn hơn"></label><p class="hint" style="margin-top:14px">Model, prompt và ví dụ mẫu được giữ lại để bạn chỉnh sửa.</p>`,`<button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="confirmCreate()">Tạo nháp</button>`);}
function confirmCreate(){const name=document.getElementById('newname').value.trim()||'Bản nháp mới';const id=Math.max(20,...drafts.map(d=>d.id))+1;drafts.unshift({id,name,model:live.model,effort:live.effort,note:'Từ cấu hình #'+live.id,prompt:promptDefault,version:1,run:'Chưa chạy'});closeModal();editDraft(id);toast('Đã tạo nháp #'+id+' · dữ liệu demo');}
function cloneDraft(id){const d=drafts.find(d=>d.id===id),newid=Math.max(...drafts.map(d=>d.id))+1;drafts.unshift({...d,id:newid,name:d.name+' (bản sao)',version:1,run:'Chưa chạy',cost:null});render();toast('Đã nhân bản nháp');}
function deleteDraft(id){const d=drafts.find(d=>d.id===id);if(d.run==='Đang chạy'){toast('Hủy lần chạy trước khi xóa nháp này.');return;}modal('Xóa nháp #'+id+'?',esc(d.name),'<p class="bodycopy">Xóa nháp khỏi danh sách. Các kết quả và chi phí đã phát sinh vẫn được giữ trong lịch sử lần chạy.</p>',`<button class="btn" onclick="closeModal()">Giữ nháp</button><button class="btn danger" onclick="drafts=drafts.filter(d=>d.id!==${id});editing=null;closeModal();render();toast('Đã xóa nháp demo')">Xóa nháp</button>`);}
function editorScreen(){const d=drafts.find(d=>d.id===editing);return `<div class="editorhead"><button class="btn ghost sm" onclick="editing=null;render()">${icon('arrow')}Danh sách nháp</button><div class="between" style="margin-top:12px"><h2>Nháp #${d.id}</h2><span class="chip" id="savestate">Đã lưu · lần ${d.version}</span></div></div><div class="editorgrid"><label class="field wide">Tên nháp<input class="control" id="draftname" value="${esc(d.name)}" oninput="markDirty()"></label><label class="field">Model<select id="model" class="control" onchange="markDirty()">${['gpt-6.1-terra','gpt-6.1-sol','claude-sonnet-5-5'].map(m=>`<option ${m===d.model?'selected':''}>${m}</option>`).join('')}</select></label><label class="field">Effort<select id="effort" class="control" onchange="markDirty()">${['Mặc định','none','minimal','low','medium','high','xhigh','max'].map(m=>`<option ${m===d.effort?'selected':''}>${m}</option>`).join('')}</select></label><label class="field">Thinking<select class="control" ${d.model.startsWith('gpt')?'disabled':''}><option>Mặc định của model</option><option>Tắt</option></select></label><label class="field">Giới hạn output token<input type="number" min="1" id="tokens" class="control" value="1200" oninput="markDirty()"></label><label class="field wide">Hướng dẫn cho model<textarea id="prompt" class="prompt" oninput="markDirty()">${esc(d.prompt)}</textarea></label><details class="wide promptpeek"><summary>Ví dụ mẫu (few-shot) · 2 ví dụ</summary><pre>Input: word = attention, meaning_vi = sự chú ý\nOutput: Please pay ___ to the safety instructions.\naccepted_answers: ["attention"]\n\nPhần này là prompt mẫu, khác với bộ ví dụ dùng để eval.</pre></details></div><section class="edit-section"><div class="between"><div><h3>Thử nghiệm nội dung đang sửa</h3><p class="hint">Dùng model và prompt trên màn hình, không cần lưu nháp.</p></div></div><div class="row" style="margin-top:14px"><button class="btn" onclick="openPicker()">${icon('list')}Chạy thử · chọn từ</button><button class="btn primary" onclick="startEval()">${icon('play')}Chạy bộ ví dụ</button></div><p class="hint" style="margin-top:12px">Chạy thử: chọn tối đa 5 ví dụ dev. Eval: chạy toàn bộ phiên bản chốt v4, gồm 70 dev + 30 held-out.</p><div id="recent-run" style="margin-top:14px">${draftRuns(d)}</div></section><div class="actionfooter"><button class="btn" onclick="saveDraft()">Lưu nháp</button><button class="btn primary" onclick="publishDialog(${d.id})">Kiểm tra & publish</button></div><p class="legalnote">Chạy tạm tạo snapshot riêng. Nếu muốn dùng kết quả đó để publish, nội dung nháp đã lưu phải trùng snapshot. Đây là cơ chế đề xuất cần bổ sung API.</p>`;}
function draftRuns(d){const bs=batches.filter(b=>b.draft===d.id);return bs.length?bs.slice(0,3).map(b=>`<div class="run-summary">${status(b.state)}<div style="flex:1"><strong class="small">${b.id} · ${esc(b.model)}</strong><span class="secondary">${b.count} ví dụ · ${b.temporary?'Chạy tạm, chưa lưu nháp':'Nháp đã lưu'} · $${Number(b.cost).toFixed(4)}</span></div><button class="textbutton" onclick="batchDetail('${b.id}')">Xem kết quả</button></div>`).join(''):'<p class="hint">Chưa có lần chạy. Chọn vài từ để thử trước khi chạy cả bộ.</p>';}
function markDirty(){const el=document.getElementById('savestate');if(el){el.textContent='Có thay đổi chưa lưu';el.className='chip yellow';}}
function readEditor(){return {name:document.getElementById('draftname').value,model:document.getElementById('model').value,effort:document.getElementById('effort').value,prompt:document.getElementById('prompt').value};}
function saveDraft(){const d=drafts.find(d=>d.id===editing),current=readEditor();const changed=current.model!==d.model||current.effort!==d.effort||current.prompt!==d.prompt;Object.assign(d,current);d.version++;if(changed){const match=batches.find(b=>b.draft===d.id&&b.kind==='Eval'&&b.state==='Xong'&&b.snapshot===JSON.stringify(current));if(!match){d.run='Chưa chạy';d.cost=null;}}render();toast('Đã lưu nháp #'+d.id+' · dữ liệu demo');}
function openPicker(){quickPicked=new Set();quickSearch='';quickLevel='all';lastOutput=false;modal('Chọn từ để chạy thử','Lấy từ bộ ví dụ dev · tối đa 5 từ. Held-out không được hiển thị.',`<div class="toolbar" style="padding-top:0"><label class="search">Tìm từ<input class="control" id="picker-search" placeholder="Nhập từ hoặc nghĩa…" oninput="quickSearch=this.value;renderPickerRows()"></label><label>Trình độ<select class="control" id="picker-level" onchange="quickLevel=this.value;renderPickerRows()"><option value="all">Tất cả trình độ</option>${['A1','A2','B1','B2','C1','C2'].map(l=>`<option>${l}</option>`).join('')}</select></label></div><div id="picker-rows"></div><div id="quick-results"></div>`,`<span id="picker-count" class="small muted">Đã chọn 0/5</span><div class="row"><button class="btn" onclick="closeModal()">Đóng</button><button class="btn primary" id="quick-run" disabled onclick="runQuick()">Chạy thử 0 từ</button></div>`);renderPickerRows();}
function renderPickerRows(){const ws=words.filter(w=>w.split==='dev'&&(quickLevel==='all'||w.level===quickLevel)&&(w.word+' '+w.meaning).toLowerCase().includes(quickSearch.toLowerCase()));document.getElementById('picker-rows').innerHTML=ws.length?ws.map(w=>`<label class="picker-row"><input aria-label="Chọn ${w.word}" type="checkbox" ${quickPicked.has(w.id)?'checked':''} onchange="toggleQuick(${w.id},this.checked)"><span><strong>${w.word}</strong><p>${w.meaning}</p></span><span class="chip">${w.level}</span></label>`).join(''):'<p class="empty">Không có ví dụ dev phù hợp. Thử từ khóa hoặc trình độ khác.</p>';updateQuick();}
function toggleQuick(id,on){if(on&&quickPicked.size>=5){toast('Chọn tối đa 5 ví dụ mỗi lần chạy thử.');renderPickerRows();return;}on?quickPicked.add(id):quickPicked.delete(id);updateQuick();}
function updateQuick(){document.getElementById('picker-count').textContent='Đã chọn '+quickPicked.size+'/5';const b=document.getElementById('quick-run');b.disabled=!quickPicked.size;b.textContent='Chạy thử '+quickPicked.size+' từ';}
function runQuick(){const current=readEditor();const count=quickPicked.size;const id='TS-'+(33+batches.length);batches.unshift({id,kind:'Chạy thử',draft:editing,model:current.model,state:'Xong',count,done:count,cost:'.0038',time:'Vừa xong',temporary:true,input:2400,output:280,retry:0});document.getElementById('quick-results').innerHTML=`<div class="testresult"><div class="between"><h3>Kết quả minh họa</h3><span class="chip yellow">Snapshot · chưa lưu</span></div><p class="hint">${esc(current.model)} · ${count} ví dụ · $0.0038</p><div class="resultsentence" style="margin-top:12px">The engineer will ___ the update to the server tonight.</div><p class="hint" style="margin-top:8px">Đáp án: deploy · Khuôn: đạt · Luật: đạt</p><p class="small muted">Dữ liệu minh họa để duyệt luồng, không phải output thật cho các từ vừa chọn.</p></div>`;document.getElementById('quick-run').textContent='Chạy lại '+count+' từ';toast('Đã mô phỏng chạy thử · nháp chưa được lưu');}
function startEval(){const current=readEditor(),d=drafts.find(d=>d.id===editing);const id='EV-'+(29+batches.length);batches.unshift({id,kind:'Eval',draft:d.id,model:current.model,state:'Đang chạy',count:100,done:0,cost:'.0000',time:'Vừa bắt đầu',temporary:true,snapshot:JSON.stringify(current),input:0,output:0,retry:0});d.run='Đang chạy';d.progress=0;d.count=100;document.getElementById('recent-run').innerHTML=draftRuns(d);toast('Đã tạo batch '+id+' · chạy tạm, không lưu nháp');}
function publishDialog(id){
const d=drafts.find(d=>d.id===id);
if(editing===id&&document.getElementById('model')){const current=readEditor();if(current.name!==d.name||current.model!==d.model||current.effort!==d.effort||current.prompt!==d.prompt){modal('Lưu nội dung trước khi publish','Chạy thử không tự lưu nháp.', '<p class="bodycopy">Bạn đang có thay đổi chưa lưu. Lưu nháp để kiểm tra nội dung khớp snapshot eval hay cần chạy lại. Publish sẽ không tự dùng cấu hình cũ sau lưng bạn.</p>', '<button class="btn" onclick="closeModal()">Quay lại sửa</button><button class="btn primary" onclick="closeModal();saveDraft()">Lưu nháp & kiểm tra lại</button>');return;}}
if(d.run!=='Xong'){modal('Chưa đủ bằng chứng để publish',d.name,'<p class="bodycopy">Nháp này chưa có eval hoàn tất khớp với nội dung đã lưu. Chạy bộ ví dụ, đọc kết quả rồi quay lại.</p>',`<button class="btn primary" onclick="closeModal();editDraft(${id})">Mở nháp</button>`);return;}modal('Publish nháp #'+id+'?',`Thay ${live.model} bằng ${d.model}.`,'<div class="callout">Bộ ví dụ v4 · 100 câu · nội dung nháp khớp với snapshot eval.</div><div class="batchdetails" style="margin-top:16px"><div>Khuôn<b>100 / 100</b></div><div>Luật<b>96 / 100</b></div><div>Ô mong đợi<b>98 / 100</b></div><div>Judge<b>Chưa chấm</b></div></div><p class="hint" style="margin-top:16px">Minh họa baseline đã đủ. App thật vẫn kiểm tra baseline, snapshot và cảnh báo trước khi cho publish.</p>',`<button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="mockPublish(${id})">Publish bản này</button>`);}
function mockPublish(id){const d=drafts.find(d=>d.id===id);live={id:d.id,model:d.model,name:d.name,effort:d.effort,date:'Vừa xong'};drafts=drafts.filter(d=>d.id!==id);editing=null;closeModal();render();toast('Đã đổi bản đang chạy trong mockup');}
function historyScreen(){return `<div class="between" style="margin-bottom:17px"><h2>Lịch sử</h2><span class="small muted">${ops[op]}</span></div><div class="subtabs"><button class="${historyTab==='publish'?'active':''}" onclick="historyTab='publish';render()">Publish & rollback</button><button class="${historyTab==='prompt'?'active':''}" onclick="historyTab='prompt';render()">Lịch sử prompt</button></div>${historyTab==='publish'?`<p class="hint">Những lần thay đổi bản phục vụ người học.</p>${[{id:17,name:'Publish cấu hình #17',model:'claude-sonnet-5-5',date:'30/10/2026 · 16:42',note:'Thay #16 · cập nhật ngữ cảnh cho từ gần nghĩa'},{id:16,name:'Rollback về cấu hình #16',model:'gpt-6.1-terra',date:'29/10/2026 · 10:15',note:'Quay về từ #15 · không tạo lần chạy mới'},{id:15,name:'Publish cấu hình #15',model:'gpt-6.1-sol',date:'28/10/2026 · 09:30',note:'Thay #14 · bộ ví dụ v3'}].map(h=>`<div class="historyrow"><span class="historydot"></span><div><strong>${h.name}</strong><span class="secondary">${h.date} · Tiến Ngô</span><p>${h.model}<br>${h.note}</p><button class="textbutton" onclick="showPrompt(${h.id})">Xem prompt & cấu hình</button></div><button class="btn sm" onclick="createDraft()">Tạo nháp từ bản này</button></div>`).join('')}`:`<p class="hint">Các bản prompt trong cấu hình và lịch sử cũ trước khi có vòng đời cấu hình.</p><div class="historyrow"><span class="historydot"></span><div><strong>Cấu hình #17 · prompt đã publish</strong><span class="secondary">30/10/2026 · 16:42 · Tiến Ngô</span><p>Thêm ràng buộc ngữ cảnh, giữ bản dịch sát nghĩa.</p><button class="textbutton" onclick="showPrompt(17)">Xem nội dung prompt</button></div><span class="chip green" style="align-self:start">Đang chạy</span></div><div class="historyrow"><span class="historydot"></span><div><strong>Nháp #18 · lần lưu 3</strong><span class="secondary">30/10/2026 · 14:20 · Tiến Ngô</span><p>Giảm hướng dẫn lặp lại, thử Terra.</p><button class="textbutton" onclick="showPrompt(18)">Xem nội dung prompt</button></div><span class="chip yellow" style="align-self:start">Đề xuất lưu revision</span></div><div class="historyrow"><span class="historydot"></span><div><strong>Prompt cũ · bản 4</strong><span class="secondary">27/10/2026 · 09:12 · Hệ thống</span><p>Lịch sử trước khi chuyển sang cấu hình.</p><button class="textbutton" onclick="showPrompt(4)">Xem nội dung prompt</button></div><span class="chip" style="align-self:start">Lịch sử cũ</span></div>`}`;}
function showPrompt(id){modal('Prompt · bản #'+id,'Nội dung minh họa. Lịch sử chỉ đọc.',`<pre>${esc(promptDefault)}</pre>`,`<button class="btn" onclick="closeModal()">Đóng</button><button class="btn primary" onclick="closeModal();createDraft()">Tạo nháp từ bản này</button>`);}
function filteredWords(){let rows=words.filter(w=>(filterSplit==='all'||w.split===filterSplit)&&(filterLevel==='all'||w.split==='dev'&&w.level===filterLevel)&&(!search||w.split==='dev'&&(w.word+' '+w.meaning).toLowerCase().includes(search.toLowerCase())));return rows.sort((a,b)=>{if(sort==='held')return Number(b.split==='held_out')-Number(a.split==='held_out');if(sort==='newest')return b.id-a.id;if(a.split!==b.split)return a.split==='dev'?-1:1;return sort==='za'?b.word.localeCompare(a.word):a.word.localeCompare(b.word);});}
function examplesScreen(){const rows=filteredWords(),pages=Math.max(1,Math.ceil(rows.length/10));wordPage=Math.min(wordPage,pages);const visible=rows.slice((wordPage-1)*10,wordPage*10);return `<div class="heading between"><div><h1>Bộ ví dụ</h1><p>Soạn, chọn và dọn ví dụ trước khi chốt phiên bản.</p></div><div class="row"><button class="btn" onclick="toast('Demo: mở nhập hàng loạt JSONL / CSV')">Nhập hàng loạt</button><button class="btn primary" onclick="toast('Demo: mở form thêm ví dụ')">${icon('plus')}Thêm ví dụ</button></div></div>${opSelect()}<div class="between"><p class="small muted">${words.length} ví dụ · ${words.filter(w=>w.split==='dev').length} dev · ${words.filter(w=>w.split==='held_out').length} held-out</p><button class="btn sm" onclick="toast('Demo: chốt phiên bản mới của toàn bộ bộ ví dụ')">Chốt phiên bản</button></div><div class="toolbar"><label class="search">Tìm ví dụ dev<input id="example-search" class="control" value="${esc(search)}" placeholder="Từ hoặc nghĩa…" oninput="search=this.value;wordPage=1;renderExamplesKeepingFocus()"></label><label>Phần<select class="control" onchange="filterSplit=this.value;wordPage=1;render()">${[['all','Dev & held-out'],['dev','Chỉ dev'],['held_out','Chỉ held-out']].map(([k,v])=>`<option value="${k}" ${filterSplit===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Trình độ<select class="control" onchange="filterLevel=this.value;wordPage=1;render()"><option value="all">Tất cả</option>${['A1','A2','B1','B2'].map(l=>`<option ${filterLevel===l?'selected':''}>${l}</option>`).join('')}</select></label><label>Sắp xếp<select class="control" onchange="sort=this.value;wordPage=1;render()">${[['az','Từ A → Z'],['za','Từ Z → A'],['newest','Mới nhất'],['held','Held-out trước']].map(([k,v])=>`<option value="${k}" ${sort===k?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="bulkbar"><div class="between"><div class="summary"><strong class="small">Đã chọn ${selected.size} ví dụ</strong><button class="textbutton" onclick="selected.clear();render()" ${!selected.size?'disabled':''}>Bỏ chọn</button></div><button class="btn sm ${selected.size?'danger':''}" ${!selected.size?'disabled':''} onclick="deleteSelected()">${icon('trash')}Xóa đã chọn${selected.size?' ('+selected.size+')':''}</button></div>${visible.length?`<p class="small" style="margin-top:8px">Tick đầu bảng chọn ${visible.length} dòng trên trang. <button class="textbutton" onclick="filteredWords().forEach(w=>selected.add(w.id));render()">Chọn toàn bộ ${rows.length} kết quả đang lọc</button></p>`:''}${selected.size>visible.filter(w=>selected.has(w.id)).length?'<p class="small muted" style="margin-top:5px">Lựa chọn được giữ khi chuyển trang hoặc đổi bộ lọc.</p>':''}</div><div class="tablewrap"><table><thead><tr><th style="width:38px"><input id="selectpage" type="checkbox" aria-label="Chọn tất cả trên trang này" onchange="selectPage(this.checked)"></th><th>Ví dụ</th><th>Trình độ</th><th>Phần</th><th class="hide-mobile">Ô mong đợi</th><th aria-label="Hành động"></th></tr></thead><tbody>${visible.map(w=>`<tr class="${selected.has(w.id)?'selected':''}"><td><input aria-label="Chọn ví dụ ${w.split==='dev'?w.word:'held-out #'+w.id}" type="checkbox" ${selected.has(w.id)?'checked':''} onchange="this.checked?selected.add(${w.id}):selected.delete(${w.id});render()"></td><td>${w.split==='dev'?`<strong>${w.word}</strong><span class="secondary">${w.pos} · ${w.meaning}</span>`:'<span class="muted">Nội dung được ẩn</span><span class="secondary">Held-out · không xem từ, nghĩa hoặc level</span>'}</td><td>${w.split==='dev'?`<span class="chip">${w.level}</span>`:'—'}</td><td><span class="chip ${w.split==='dev'?'':'yellow'}">${w.split==='dev'?'dev':'held-out'}</span></td><td class="hide-mobile">${w.split==='dev'?'<span class="small" style="color:var(--success)">Đã có</span>':'—'}</td><td><button class="textbutton" onclick="toast('${w.split==='dev'?'Demo: sửa ví dụ':'Xem held-out cần xác nhận và chuyển sang dev'}')">${w.split==='dev'?'Sửa':'Mở…'}</button></td></tr>`).join('')}</tbody></table>${!visible.length?'<div class="empty">Không có ví dụ phù hợp.</div>':''}</div><div class="pagination"><span>${rows.length?`${(wordPage-1)*10+1}–${Math.min(wordPage*10,rows.length)}`:'0'} / ${rows.length} ví dụ <span class="note-badge">Mockup: 10 dòng/trang</span></span><div class="row"><button class="btn sm" ${wordPage===1?'disabled':''} onclick="wordPage--;render()">Trang trước</button><span>Trang ${wordPage}/${pages}</span><button class="btn sm" ${wordPage>=pages?'disabled':''} onclick="wordPage++;render()">Trang sau</button></div></div><p class="legalnote">Bộ lọc từ / trình độ chỉ tìm trong dev. Held-out không bị lộ qua bộ lọc. Xóa khỏi bộ đang soạn không thay đổi các phiên bản đã chốt.</p>`;}
function renderExamplesKeepingFocus(){const el=document.getElementById('example-search'),pos=el.selectionStart;render();const next=document.getElementById('example-search');next.focus();next.setSelectionRange(pos,pos);}
function setSelectionState(){const rows=filteredWords().slice((wordPage-1)*10,wordPage*10),n=rows.filter(w=>selected.has(w.id)).length;const c=document.getElementById('selectpage');if(c){c.checked=rows.length>0&&n===rows.length;c.indeterminate=n>0&&n<rows.length;}}
function selectPage(on){filteredWords().slice((wordPage-1)*10,wordPage*10).forEach(w=>on?selected.add(w.id):selected.delete(w.id));render();}
function deleteSelected(){const ids=new Set(selected),held=words.filter(w=>ids.has(w.id)&&w.split==='held_out').length;modal('Xóa '+ids.size+' ví dụ đã chọn?',`${ids.size-held} dev · ${held} held-out`,'<p class="bodycopy">Các ví dụ sẽ bị xóa khỏi bộ đang soạn. Những phiên bản đã chốt và kết quả eval cũ vẫn được giữ. Không thể hoàn tác.</p>',`<button class="btn" onclick="closeModal()">Giữ lại</button><button class="btn danger" id="confirm-delete">Xóa ${ids.size} ví dụ</button>`);document.getElementById('confirm-delete').onclick=()=>{words=words.filter(w=>!ids.has(w.id));selected.clear();closeModal();render();toast('Đã xóa '+ids.size+' ví dụ trong mockup');};}
function costScreen(){const kinds=['Tất cả','Eval','Chạy thử','Judge'];return `<div class="heading between"><div><h1>Chi phí AI</h1><p>Mỗi dòng là một lần chạy. Token và chi phí gộp tất cả ví dụ, gồm cả retry.</p></div><button class="btn" onclick="toast('Demo: xuất báo cáo theo các batch đang lọc')">Xuất báo cáo</button></div><div class="toolbar"><label>Từ ngày<input class="control" type="date" value="2026-10-25" onchange="toast('Demo: đổi khoảng ngày')"></label><label>Đến ngày<input class="control" type="date" value="2026-10-31" onchange="toast('Demo: đổi khoảng ngày')"></label><label>Loại batch<select class="control" id="batchkind" onchange="renderBatchRows()">${kinds.map(k=>`<option>${k}</option>`).join('')}</select></label><label>Trạng thái<select class="control" id="batchstate" onchange="renderBatchRows()"><option>Tất cả</option><option>Xong</option><option>Đang chạy</option></select></label></div><div class="costsummary"><div><span>Chi phí ghi nhận trong khoảng</span><strong id="totalcost">$${batches.reduce((sum,b)=>sum+Number(b.cost),0).toFixed(4)}</strong></div><div><span>Lần chạy</span><strong id="totalbatch">${batches.length}</strong></div><p class="hint" style="max-width:35ch">Batch đang chạy có chi phí tạm tính. Chưa biết giá sẽ hiện “Chưa đủ giá”, không tính bằng $0.</p></div><div class="subtabs" style="margin:20px 0"><button class="active" onclick="toast('Bạn đang xem chi phí theo batch')">Theo lần chạy</button><button onclick="showAggregate()">Tổng hợp hiện có</button></div><div class="tablewrap"><table><thead><tr><th>Batch / lần chạy</th><th>Model & cấu hình</th><th>Tiến độ</th><th class="numeric optional">Token in / out</th><th class="numeric">Chi phí USD</th><th aria-label="Hành động"></th></tr></thead><tbody id="batchrows">${batchRows(batches)}</tbody></table></div><p class="legalnote">Đề xuất: 1 eval, 1 lượt chạy thử nhiều từ, hoặc 1 lượt judge = 1 batch. Usage của người học vẫn ở báo cáo tổng hợp, không bị bỏ khỏi tổng chi phí toàn hệ thống.</p>`;}
function batchRows(bs){return bs.map(b=>`<tr><td><button class="titlelink" onclick="batchDetail('${b.id}')">${b.id} <span class="chip ${b.kind==='Judge'?'yellow':'blue'}">${b.kind}</span></button><span class="secondary">${b.time}</span></td><td><strong>${b.model}</strong><span class="secondary">Nháp #${b.draft}${b.temporary?' · snapshot chạy tạm':''}</span></td><td>${status(b.state)}<span class="secondary">${b.done}/${b.count} ví dụ</span></td><td class="numeric optional">${b.input.toLocaleString('en')} / ${b.output.toLocaleString('en')}</td><td class="numeric"><strong>$${Number(b.cost).toFixed(4)}</strong>${b.state==='Đang chạy'?'<span class="secondary">Tạm tính</span>':''}</td><td><button class="textbutton" onclick="batchDetail('${b.id}')">Chi tiết</button></td></tr>`).join('');}
function renderBatchRows(){const kind=document.getElementById('batchkind').value,state=document.getElementById('batchstate').value,bs=batches.filter(b=>(kind==='Tất cả'||b.kind===kind)&&(state==='Tất cả'||b.state===state));document.getElementById('batchrows').innerHTML=batchRows(bs);document.getElementById('totalbatch').textContent=bs.length;document.getElementById('totalcost').textContent='$'+bs.reduce((s,b)=>s+Number(b.cost),0).toFixed(4);}
function batchDetail(id){const b=batches.find(b=>b.id===id);modal('Chi tiết batch '+id,`${b.kind} · nháp #${b.draft} · ${b.model}`,`<div class="between">${status(b.state)}<span class="chip ${b.temporary?'yellow':'blue'}">${b.temporary?'Chạy tạm · không lưu nháp':'Snapshot của bản đã lưu'}</span></div><div class="batchdetails" style="margin-top:18px"><div>Số ví dụ<b>${b.done}/${b.count}</b></div><div>Tổng chi phí${b.state==='Đang chạy'?' tạm tính':''}<b>$${Number(b.cost).toFixed(4)}</b></div><div>Token input / output<b>${b.input.toLocaleString('en')} / ${b.output.toLocaleString('en')}</b></div><div>Lời gọi retry<b>${b.retry} · đã gồm trong tổng</b></div></div><div class="callout" style="margin-top:18px">Một batch giữ model, prompt và settings ở thời điểm chạy. Sửa nháp sau đó không làm đổi nội dung hoặc số tiền của batch này.</div>${b.kind==='Eval'&&b.state==='Xong'?'<div class="run-summary"><strong class="small">Khuôn 100/100 · Luật 96/100 · Mong đợi 98/100</strong></div>':''}<details class="promptpeek" style="margin-top:18px"><summary>Xem prompt snapshot</summary><pre>${esc(promptDefault)}</pre></details>`,`<button class="btn" onclick="closeModal()">Đóng</button><button class="btn primary" onclick="closeModal();go('configs');editDraft(${b.draft})">Mở nháp</button>`);}
function showAggregate(){modal('Tổng hợp chi phí hiện có','Giữ báo cáo ngày, thao tác, model, mục đích và kết quả.',`<p class="bodycopy">Màn theo batch bổ sung một cách đọc chi phí; tổng hợp toàn hệ thống vẫn gồm lời gọi của người học, chạy thử, eval và judge. Các batch trong bảng không cộng chồng thêm vào tổng.</p>`,`<button class="btn primary" onclick="closeModal()">Đã hiểu</button>`);}
function showNotes(){modal('Ghi chú thiết kế & phạm vi API','Đề xuất để bạn duyệt · chưa sửa code app.',`<div class="bodycopy"><h3>Đã chốt từ yêu cầu</h3><ul><li>Tick một / nhiều / toàn bộ ví dụ để xóa.</li><li>Nhiều bản nháp, hai trang Nháp / Lịch sử, bản đang chạy giữ bên phải.</li><li>Chọn từ dev có search và filter level để test.</li><li>Chạy tạm nội dung đang sửa, không lưu nháp.</li><li>Chi phí mỗi lần chạy là một batch.</li></ul><h3>Đề xuất cần bạn duyệt qua mockup</h3><ul><li>Chọn tất cả tách thành “trang này” và “toàn bộ kết quả đang lọc”.</li><li>Lưu snapshot chạy tạm bất biến. Chỉ dùng làm bằng chứng publish khi nội dung nháp đã lưu trùng snapshot.</li><li>Lịch sử prompt bao gồm bản đã publish, lịch sử cũ, và revision của từng lần lưu nháp.</li><li>Mobile: bản đang chạy gọn lại phía trên, bấm để mở; desktop giữ sticky bên phải.</li></ul><h3>Cần sửa API / DB</h3><p>Nhiều nháp: bỏ unique một nháp/thao tác, dùng draft ID cho sửa/xóa/chạy/publish. Chạy tạm: nhận snapshot đầy đủ. Chi phí batch: liên kết calls với batch và tổng hợp server-side. Xóa nhiều: thêm bulk endpoint để xử lý kết quả và rate limit. Lưu mọi revision prompt của nháp: bổ sung lịch sử.</p><p style="margin-top:12px">Prototype chỉ đổi dữ liệu trong bộ nhớ trình duyệt. Reload để quay lại trạng thái đầu.</p></div>`,`<button class="btn primary" onclick="closeModal()">Đóng</button>`);}
function modal(title,sub,body,footer){const d=document.getElementById('modal');if(d.open)d.close();d.innerHTML=`<div class="modalhead"><div><h2 id="modaltitle">${title}</h2><p>${sub}</p></div><button class="btn ghost sm" aria-label="Đóng" onclick="closeModal()">${icon('close')}</button></div><div class="modalbody">${body}</div><div class="modalfooter">${footer}</div>`;d.showModal();}
function closeModal(){document.getElementById('modal').close();}
function toast(s){const t=document.getElementById('toast');clearTimeout(toastTimer);t.textContent=s;t.hidden=false;toastTimer=setTimeout(()=>t.hidden=true,4200);}
document.addEventListener('click',e=>{document.querySelectorAll('details.menu[open]').forEach(d=>{if(!d.contains(e.target))d.open=false;});});
document.addEventListener('toggle',e=>{const d=e.target;if(!d.matches?.('details.menu')||!d.open)return;const menu=d.querySelector('.items'),r=d.querySelector('summary').getBoundingClientRect();menu.style.position='fixed';menu.style.right='auto';menu.style.left=Math.max(12,Math.min(r.right-190,innerWidth-202))+'px';menu.style.top=Math.max(12,Math.min(r.bottom+5,innerHeight-menu.offsetHeight-12))+'px';},true);
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
render();
</script>
</body>
</html>
